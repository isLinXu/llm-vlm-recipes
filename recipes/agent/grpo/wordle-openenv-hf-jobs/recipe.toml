schema = 1
id = "agent/grpo/wordle-openenv-hf-jobs"
name = "Wordle / OpenEnv 多轮 Agent GRPO（HF Jobs 非交互执行）"
status = "ported"
coverage = "params"
confidence = "primary"
source = "https://huggingface.co/learn/cookbook/grpo_agent_wordle_hf_jobs"
source_sha = ""
report_section = "05"
tags = ["agent", "grpo", "rl", "openenv", "hf-jobs", "cost-gate", "multi-turn"]

[method]
family = "grpo"
trainer = "GRPOTrainer"

[model]
base = "Qwen/Qwen3-0.6B"
base_alt = "Qwen/Qwen3-1.7B"
base_selection = "vram_gb >= 24 ? base_alt : base"
modality = "llm"

[dataset]
kind = "online"
name = "OpenEnv Wordle（在线生成，无静态数据集）"
structure = "conversational"
type = "prompt-only"

# 上游安装命令：pip install -q trl ... "transformers>=5.3.0"
# 既无 trl 版本，也无 transformers 精确版本。原 1.7.0 / 5.3.0 属编造，已移除。
# 待核实后再以精确 pin 补回 [dependencies]，并登记进 [[compat.matrix]]。

[environment]
name = "OpenEnv Wordle"
single_session = true
note = "单会话环境；crash 会泄漏 session 直到 CAPACITY_REACHED，必须保证 finally 释放"

[execution]
runner = "hf-jobs"
launcher = "papermill"
smoke_flag = "SMOKE"
note = "非交互长任务；notebook 经 papermill 参数化提交"
command = "python3 runner/train.py --recipe agent/grpo/wordle-openenv-hf-jobs --full"
entrypoint = "../../../../runner/train.py"
lockfile = "../../../../runner/locks/agent__grpo__wordle-openenv-hf-jobs.lock.toml"
eval_script = "../../../../runner/eval.py"
zero_shot_script = "../../../../runner/zero_shot.py"
evidence = "evidence/run.json"
adapter_status = "unimplemented：OpenEnv / Wordle reward 与环境尚未移植到统一 runner；上游执行路径为 HF Jobs + papermill，--full 会明确拒绝"

[rewards]
functions = ["environment_scalar_reward"]
failure_path_tested = true
failure_path_note = "invalid move 也可能拿到 partial credit，不能用 reward > 0 判定胜利；正确条件是 solved = bool(env.done and reward >= ENV_SOLVED_REWARD)"

[budget]
smoke_steps = 5
full_steps = 150
smoke_grad_accum = 8
full_grad_accum = 64
smoke_eval_games = 3
full_eval_games = 20
smoke_n_prompts = 30
full_n_prompts = 3000
est_full_gpu_hours = 6.2

[throughput]
calibration_seconds = 92.4
calibration_rollouts = 40
seconds_per_rollout = 2.31
note = "用吞吐校准反推 --flavor 与 --timeout，而不是拍脑袋设超时"

[baseline]
zero_train = true
result = "unmeasured"
description = "原模型在固定种子 Wordle 局集上的 solved rate"

[evaluation]
metrics = ["solved_rate", "avg_turns_to_solve", "invalid_move_rate"]
held_out = true
seed = 42
multi_run = true
compute_metrics = true
split = "OpenEnv 在线生成无静态 split；baseline 固定 budget.full_eval_games=20 局、固定对局种子"

[hardware]
runner = "HF Jobs (cloud GPU)"
per_device_train_batch_size = 1

[known_issues]
items = [
  "OpenEnv 单会话，crash 会泄漏 session 直到 CAPACITY_REACHED",
  "vLLM 在 IPython 下初始化冲突",
  "上游写 transformers>=5.3.0，是浮动约束，不可复现",
  "多轮环境中 reward 是稀疏且带 partial credit 的标量，最容易出奖励黑客",
]

[upstream_deviations]
items = [
  "移除伪精确 pin；transformers>=5.3.0 是上游唯一约束，待核实实际版本后再补",
  "solved 判定改为 env.done and reward >= ENV_SOLVED_REWARD，并写成单测",
  "SMOKE 作为成本闸门，smoke/full 参数全部显式化；full run 前先做吞吐校准投影",
]

[todo]
items = [
  "把 reward 失败路径单测落到 tests/，覆盖 invalid move / 未结束 / 结束但低分三种情况",
  "实现 session 释放的 finally 保护，并在 smoke 中验证无泄漏",
  "跑零训练基线并更新 baseline.result",
]


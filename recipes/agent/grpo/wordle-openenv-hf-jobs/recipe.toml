assessed_at = "2026-11-13"
assessed_by = "hand-audit + primary-source-check"
evidence_ref = "webfetch:grpo_agent_wordle_hf_jobs"
evidence = ""
note = "基座模型按显存自动选 Qwen3-0.6B / 1.7B，原值系编造，已纠正"

[repro.code]
state = "missing"
gap = "上游 14 篇均为 .ipynb；本仓库已提供统一 runner，但那是我们自建的执行层，不等于能重放上游 notebook"

[repro.env]
state = "missing"

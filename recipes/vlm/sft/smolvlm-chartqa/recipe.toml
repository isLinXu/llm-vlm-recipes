schema = 1
id = "vlm/sft/smolvlm-chartqa"
name = "SmolVLM-Instruct 2B + ChartQA SFT / QLoRA+DoRA"
status = "ported"
coverage = "params"
confidence = "primary"
source = "https://huggingface.co/learn/cookbook/fine_tuning_smol_vlm_sft_trl"
source_sha = ""
report_section = "04"
tags = ["vlm", "sft", "qlora", "dora", "chartqa", "data-leakage-risk"]

[method]
family = "sft"
trainer = "SFTTrainer"
peft = "qlora-dora"

[model]
base = "HuggingFaceTB/SmolVLM-Instruct"
params_b = 2.0
modality = "vlm"

[dataset]
name = "HuggingFaceM4/ChartQA"
structure = "conversational"
type = "prompt-completion"
has_images = true

[modality_contract]
images_column = "images"
content_list_dict = true
processing_class = "processor"
max_length = "none"
image_mode = "RGB"

[train]
bf16 = true
num_train_epochs = 1
per_device_train_batch_size = 4
gradient_accumulation_steps = 4
warmup_steps = 50
learning_rate = 1e-4
weight_decay = 0.01
max_length = "none"
seed = 42
data_seed = 42

[peft]
r = 8
lora_alpha = 8
lora_dropout = 0.1
use_dora = true
init_lora_weights = "gaussian"
target_modules = ["down_proj", "o_proj", "k_proj", "q_proj", "gate_proj", "up_proj", "v_proj"]

[quantization]
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "bfloat16"

[hardware]
accelerator = "L4"
# 上游只写 "tested using a L4 GPU"，未给显存数值；24 是推断，已移除

[consistency]
train_system_message = true
inference_system_message = true

[baseline]
zero_train = true
result = "unmeasured"
description = "先用原模型 + system message 跑同一 held-out 集"

[evaluation]
metrics = ["exact_match"]
held_out = true
seed = 42
multi_run = true
compute_metrics = true
split = "HuggingFaceM4/ChartQA；与起点篇共用同一划分。注意 SmolVLM-Instruct 本就在 ChartQA 上训过，仅作教学对照"

[budget]
smoke_steps = 5
full_steps = 200

[known_issues]
items = [
  "SmolVLM-Instruct 本来就在 ChartQA 上训练过，作者自承是 educational exercise，不构成泛化验证",
  "标题写 QLoRA/LoRA，代码 use_dora=True；说 merge adapters 但只做了 PeftModel.from_pretrained",
  "把 QLoRA 解释成量化 adapter 权重，实际量化的是 base model",
  "训练含 system message，推理丢掉 system",
]

[upstream_deviations]
items = [
  "tags 显式标注 dora，以代码而非标题为准",
  "推理保留 system message，与训练一致",
  "改用未被 ChartQA 预训练污染的 held-out 集；若无法取得，本 recipe 只能作为教学对照，不得用于泛化结论",
]

[todo]
items = [
  "把注释里的 5 个测试版本转成 requirements.lock，并锁定 trl 源码 commit",
  "确认所用 held-out 集与 SmolVLM-Instruct 预训练语料无交集，并记录证据",
  "跑零训练基线，更新 baseline.result",
]


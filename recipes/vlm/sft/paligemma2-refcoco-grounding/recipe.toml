stance = "PaliGemma/2 论文只支持模型与迁移定位，loc 1024 桶与 COCO xywh 来自 Cookbook 一手代码；本仓统一 prompt、双层 mask、单框 IoU 为自建修正，RefCOCO 一手来源未核到。"

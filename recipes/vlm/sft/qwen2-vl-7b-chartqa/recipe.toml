# 调研起点。注意：这是「我们维护的修正版配方」，不是上游 notebook 的原样抄录。
# 上游缺陷记录在 [known_issues]，我们做的修正记录在 [upstream_deviations]。
# 最重要的事实：上游第 6 节承认零训练基线即可达标，因此 decision.gate = blocked。

schema = 1
id = "vlm/sft/qwen2-vl-7b-chartqa"
name = "Qwen2-VL-7B + ChartQA SFT / QLoRA（调研起点）"
status = "cataloged"
coverage = "params"
confidence = "primary"
source = "https://huggingface.co/learn/cookbook/fine_tuning_vlm_trl"
source_sha = ""
report_section = "03"
tags = ["vlm", "sft", "qlora", "chartqa", "baseline-passes"]

[method]
family = "sft"
trainer = "SFTTrainer"
peft = "qlora"
loss = "cross-entropy"

[model]
base = "Qwen/Qwen2-VL-7B-Instruct"
params_b = 7.0
modality = "vlm"

[dataset]
name = "HuggingFaceM4/ChartQA"
structure = "conversational"
type = "prompt-completion"
has_images = true
split = "train[:10%] / val[:10%] / test[:10%]"

[modality_contract]
images_column = "images"
content_list_dict = true
processing_class = "processor"
max_length = "none"
image_mode = "RGB"
vision_tower = "frozen"
vision_info = "process_vision_info(messages)"

[train]
num_train_epochs = 3
learning_rate = 2e-4
per_device_train_batch_size = 4
gradient_accumulation_steps = 8
bf16 = true
warmup_ratio = 0.03
max_grad_norm = 0.3
gradient_checkpointing = false
seed = 42
data_seed = 42

[peft]
r = 8
lora_alpha = 16
lora_dropout = 0.05
target_modules = ["q_proj", "v_proj"]
use_dora = false

[quantization]
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "bfloat16"

[dependencies]
trl = "0.22.0.dev0"
bitsandbytes = "0.47.0"
peft = "0.17.1"
qwen-vl-utils = "0.0.11"
trackio = "0.2.8"

[hardware]
accelerator = "A100"
vram_gb = 80

[consistency]
train_system_message = true
inference_system_message = true

[baseline]
zero_train = true
result = "passes"
description = "base model + 一句 system message，不做任何训练"
evidence = "上游 recipe 第 6 节明确称其为 viable alternative to fine-tuning"

[decision]
gate = "blocked"
reason = "零训练基线已达标；微调只让输出格式变短，不应投入 A100 预算"

[evaluation]
strategy = "steps"
metrics = ["exact_match"]
held_out = true
seed = 42
multi_run = true
compute_metrics = true
split = "HuggingFaceM4/ChartQA train[:10%]/val[:10%]/test[:10%]（上游原文）；baseline 用 test[:10%]"

[budget]
smoke_steps = 5
full_steps = 150
est_gpu_hours = 6.0

[known_issues]
items = [
  "上游 train_dataset[0][:2] 对 dict 切片，会直接 TypeError",
  "文字说 W&B，代码用 trackio.init 且 report_to='trackio'",
  "训练含 system message，推理 generate_text_from_sample 固定用 messages[1:2] 丢掉 system",
  "只设了 gradient_checkpointing_kwargs 却未显式设 gradient_checkpointing=True",
  "把 QLoRA 解释成「量化 LoRA adapter 权重」，实际量化的是 base model",
  "评估仅展示单样本定性生成，无 compute_metrics / 未见样本定量指标",
]

[upstream_deviations]
items = [
  "推理保留 system message，与训练一致",
  "显式声明 gradient_checkpointing=false，避免 kwargs 悬空",
  "评估改为 held-out exact_match + 固定 seed + 多次运行",
  "在配置中记录上游注释里的 5 个测试版本；但上游实际为 git+ 源码无 commit 安装，不能声称已锁定",
]

[todo]
items = [
  "补齐上游未给出的 transformers 精确版本，并加入 compat.matrix",
  "记录抓取时的上游 commit sha 到 source_sha",
  "跑零训练基线并留存指标文件，把 baseline.evidence 从文字升级为可执行证据",
]

# --- reproducibility audit (generated by scripts/apply_repro_audit.py) ---
[repro]
level = "L1"
assessed_at = "2026-11-13"
assessed_by = "hand-audit + primary-source-check"
evidence_ref = "local-notebook:fine_tuning_vlm_trl.txt"
evidence = ""
note = "唯一有上游自承零训练基线结论的一篇；decision.gate=blocked"

[repro.code]
state = "missing"
gap = "上游 14 篇均为 .ipynb；本仓库已提供统一 runner，但那是我们自建的执行层，不等于能重放上游 notebook"

[repro.env]
state = "declared"
gap = "5 个测试版本来自注释；上游实际为 git+ 源码无 commit 安装，无法重放"

[repro.model]
state = "declared"
gap = "repo id 已按一手材料核实，但 from_pretrained 未传 revision"

[repro.data]
state = "declared"
gap = "repo id 已按一手材料核实，但 load_dataset 未传 revision"

[repro.params]
state = "declared"
gap = "SFTConfig / LoraConfig / BitsAndBytesConfig 已与本地原文逐行核对"

[repro.seed]
state = "missing"
gap = "训练 config 无 seed / data_seed / deterministic"

[repro.eval]
state = "declared"
gap = "有 eval_dataset 与评估协议，但上游无 compute_metrics；seed=42 是我们补的协议"

[repro.provenance]
state = "declared"
gap = "有上游 HTTPS URL，但 source_sha 为空，notebook 漂移无法定位"

[execution]
command = "python3 runner/train.py --recipe vlm/sft/qwen2-vl-7b-chartqa --full"
entrypoint = "../../../../runner/train.py"
lockfile = "../../../../runner/locks/vlm__sft__qwen2-vl-7b-chartqa.lock.toml"
eval_script = "../../../../runner/eval.py"
zero_shot_script = "../../../../runner/zero_shot.py"
evidence = "evidence/run.json"
adapter_status = "skeleton：--dry-run 可用；--full 需先按 lock 锁定 revision 并补齐 PEFT / reward / 指标适配，否则 runner 明确拒绝执行"

# --- baseline contract (generated by scripts/apply_baseline_contract.py) ---
[baseline_contract]
state = "B1"
target_tier = "business"
experiment_id = "vlm-sft-qwen2-vl-7b-chartqa-v1"
revision_policy = "runner/lock.py --apply@有网环境；锁定时写入 source_sha / model.revision / dataset.revision；本机无外网，当前刻意留空"
determinism = "torch.use_deterministic_algorithms(True, warn_only=True); cudnn.deterministic=True; cudnn.benchmark=False; tf32=disabled; CUBLAS_WORKSPACE_CONFIG=:4096:8"
python_cuda = "python>=3.11,<3.14; torch CUDA build; CUDA 12.x（约束声明，实测版本由 runner/lock.py --apply 写入 lock 文件）"
single_variable = "所有可变超参集中在 [train]；runner 内禁止硬编码；对照实验只改 [train] 一处并保留 diff"
seed_origin = "seed 为本仓库定义 baseline 时声明，上游训练 config 无 seed"

[resources]
gpu = "1× A100 80GB（7B QLoRA，上游 est_gpu_hours 6.0）"
note = "B3 业务档需要实测卡时与显存；此处为预估值，不作为验收依据"

[methodology]
registry = "registry/methodology.toml"
principles = ["chartqa_zero_train_gate", "qualitative_only_gap"]
primary_papers = ["chartqa", "qwen2vl"]
supplement_papers = ["qlora"]
stance = "ChartQA 论文定义数据集、Qwen2-VL 是模型技术报告；两者都不支持训练收益。本篇方法论结论是 decision.gate=blocked：零训练基线已达标，原理性拒绝训练预算。"

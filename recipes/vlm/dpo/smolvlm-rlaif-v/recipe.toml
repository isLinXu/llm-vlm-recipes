schema = 1
id = "vlm/dpo/smolvlm-rlaif-v"
name = "SmolVLM-Instruct + rlaif-v：VLM DPO 偏好优化"
status = "cataloged"
coverage = "catalog"
confidence = "primary"
source = "https://huggingface.co/learn/cookbook/fine_tuning_vlm_dpo_smolvlm_instruct"
source_sha = ""
report_section = "04"
tags = ["vlm", "dpo", "preference", "rlaif"]

[method]
family = "dpo"
trainer = "DPOTrainer"
upstream_trainer = "DPOTrainer"
peft = "qlora-dora"
execution_trainer = "Trainer"

[model]
base = "HuggingFaceTB/SmolVLM-Instruct"
modality = "vlm"

[dataset]
name = "HuggingFaceH4/rlaif-v_formatted"
structure = "conversational"
type = "preference"
has_images = true

[modality_contract]
images_column = "images"
content_list_dict = true
processing_class = "processor"
max_length = "none"

[dependencies]
trl = "0.12.2"
transformers = "4.46.3"
datasets = "3.2.0"
bitsandbytes = "0.45.0"
peft = "0.14.0"
accelerate = "1.2.0"

# --- wave4 自建偏好协议（非上游 notebook 复现；一手缺失项逐条登记）---
[preference]
protocol = "smolvlm-dpo-v1"
source_split = "train[:6%]"
held_out_split = "test[:1%]"
split_percent = [80, 10, 10]
split_algorithm = "rlaif-v-preference-split-v1"
beta = 0.1
loss_type = "sigmoid"
max_eval_examples = 300
loss = "显式 beta 的 sigmoid DPO loss；policy/ref 仅在 completion token 上计 logprob，image placeholder 与 padding label=-100"
prompt_format = "system + user(images+prompt)；chosen/rejected 绝不进生成 prompt"
metric_definition = "win_rate/reward_accuracy 均为 policy implicit reward pairwise，不是外部 reward model/human eval"
upstream_beta = "absent（DPOConfig 未给 beta，依赖 TRL 0.12.2 默认值；本仓自建 0.1）"
upstream_loss_type = "absent（本仓自建 sigmoid，不沿用未冻结的默认实现）"
upstream_learning_rate = "absent（本仓训练 learning_rate 为自建值）"
upstream_max_length = "absent（本仓用自建 seq_length）"
upstream_ref_model = "None（本仓显式冻结 ref，不与 policy 共享 adapter）"
upstream_evaluation = "仅定性生成，无 compute_metrics；本仓补 held-out 隐式奖励 pairwise 指标"
upstream_merge = "PeftModel.from_pretrained only；无 merge_and_unload；本仓 adapter-only 打包"
upstream_dataset_split = "train[:6%] / test[:1%]；本仓按图像 hash 重划 80/10/10"
upstream_deps = "transformers==4.46.3 / trl==0.12.2 / datasets==3.2.0 / bitsandbytes==0.45.0 / peft==0.14.0 / accelerate==1.2.0 来自注释；flash-attn 无版本"
cross_backbone_attribution_valid = false
self_migration = true

[peft]
r = 8
alpha = 8
dropout = 0.1
target_module_patterns = ["language_model", "_proj"]
use_dora = true
init_lora_weights = "gaussian"
bias = "none"
task_type = "CAUSAL_LM"

[quantization]
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "bfloat16"

[upstream]
split = "dataset train[:6%] / test[:1%]；上游 evaluate 仅 test[:1%] 定性生成"
mask = "DPOTrainer 隐式处理 chosen/rejected；无显式 image_token_id 屏蔽"
evaluation = "无 compute_metrics、无数值指标，仅定性生成展示"
revision = "from_pretrained/load_dataset 均未传 revision"
seed = "DPOConfig 未给 seed/data_seed/deterministic"
merge = "文字称 merge LoRA，代码只有 PeftModel.from_pretrained，无 merge_and_unload"
attn = "flash-attn 无版本；未固定 attn_implementation"
target_modules = "7 个 LoRA target（use_dora=True，init_lora_weights=gaussian）"
trainer = "DPOTrainer（自建协议改用普通 Trainer + 自建 sigmoid DPO loss，不依赖未固定 TRL 源码）"
processing_class = "processor"

[hardware]
accelerator = "L4"

[baseline]
zero_train = true
result = "unmeasured"
description = "SFT 模型在偏好集上的 win-rate 基线"

[notes]
items = [
  "显式 prompt 的 preference 数据是 DPOTrainer 推荐格式；images 与 prompt/chosen/rejected 并列为顶层列",
  "这是仓库中最老的一组版本组合，跨 recipe 复制代码时尤其危险",
]

[known_issues]
items = [
  "标题写 LoRA，代码 use_dora=True",
  "说 merge the LoRA adapters 但只做 PeftModel.from_pretrained，未调用 merge_and_unload",
  "评估仅为定性生成展示；虽有 test[:1%] held-out split 与 eval_dataset，但无 compute_metrics",
]

[todo]
items = [
  "上游 DPOConfig 未给出 beta / loss_type / learning_rate / max_length：需显式记录 TRL 0.12.2 默认值，否则升级即变结果",
  "补 win-rate / reward accuracy 的 held-out 定量评估",
  "验证 0.12.2 API 与当前 TRL v1 的差异，决定是否升级版本",
]


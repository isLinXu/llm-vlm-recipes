dataloader_num_workers = 8
eval_strategy = "steps"
eval_steps = 10
seed = 42
data_seed = 42
# 以下为本仓自建训练参数；上游 DPOConfig 未显式给 learning_rate / beta / max_length。
learning_rate = 0.000005
lr_scheduler_type = "linear"
weight_decay = 0.0
save_steps = 10

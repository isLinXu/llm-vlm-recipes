schema = 1
id = "vlm/grpo/qwen2-5-vl-3b-visual-reasoning"
name = "Qwen2.5-VL-3B：视觉推理 GRPO（可验证奖励）"
status = "ported"
coverage = "params"
confidence = "primary"
source = "https://huggingface.co/learn/cookbook/fine_tuning_vlm_grpo_trl"
source_sha = ""
report_section = "04"
tags = ["vlm", "grpo", "rl", "reasoning", "verifiable-reward"]

[method]
family = "grpo"
trainer = "GRPOTrainer"

[model]
base = "Qwen/Qwen2.5-VL-3B-Instruct"
modality = "vlm"

[dataset]
name = "lmms-lab/multimodal-open-r1-8k-verified"
structure = "standard"
type = "prompt-only"
has_images = true

[modality_contract]
images_column = "image"
content_list_dict = false
pre_rendered_prompt = true
prompt_rendered_by = "processor.apply_chat_template"
processing_class = "processor"
# 上游原文为 GRPOConfig(max_prompt_length=2048)；仍需确认图像 token 不被截断。
max_prompt_length = 2048

[train]
remove_unused_columns = false
padding_side = "left"
num_generations = 2
max_completion_length = 1024
learning_rate = 1e-5
per_device_train_batch_size = 2
num_train_epochs = 1
seed = 42
data_seed = 42

[rewards]
functions = ["format_reward", "accuracy_reward"]
failure_path_tested = true
failure_path_note = "已核实：format_reward 不匹配返回 0.0；accuracy_reward 对 gold parse 做 try/except 令 gold_parsed=[] 并回退到归一化文本比较。gold 不可解析时的具体返回值未逐行复核，列入 todo"
format_regex = '^<think>\n.*?\n</think>\n<answer>\n.*?\n</answer>$'
verifier = "math_verify"

[baseline]
zero_train = true
result = "unmeasured"
description = "同一 verified 集上跑原模型的 pass@1（含 thinking 格式合规率）"

[evaluation]
metrics = ["pass@1", "format_compliance"]
held_out = true
seed = 42
multi_run = true
compute_metrics = true
split = "lmms-lab/multimodal-open-r1-8k-verified；baseline 固定末 500 条 held-out（本仓库定义）"

[budget]
smoke_steps = 5
full_steps = 150

[known_issues]
items = [
  "因功能尚未进 official release，上游要求源码安装 trl，未给出精确版本",
  "评估函数用 processor(...) 而前文加载的是 trained_processor",
  "reward 对 completions 的结构假设不一致：有时是字符串列表，有时取 completion[0]['content']",
  "remove_unused_columns=False 是为保留 solution 列，误删会让 accuracy_reward 拿不到答案",
]

[upstream_deviations]
items = [
  "统一 reward 的 completions 解析入口，并为其补 3 个结构用例（纯字符串 / list[dict] / 空输出）",
  "评估统一使用 trained_processor",
  "把 format 正则与 verifier 配置显式写入 [rewards]，便于跨 recipe 复现",
]

[todo]
items = [
  "锁定 trl 源码 commit",
  "验证 max_prompt_length=2048 下图像 token 是否被截断，必要时改为 None",
  "补 reward 失败路径单元测试：空输出、解析失败、格式正确但答案错误",
  "跑零训练基线并更新 baseline.result",
]


schema = 1
id = "vlm/mpo/qwen2-5-vl-3b-mpo"
name = "Qwen2.5-VL-3B + rlaif-v：MPO 组合损失"
status = "ported"
coverage = "params"
confidence = "primary"
source = "https://huggingface.co/learn/cookbook/fine_tuning_vlm_mpo"
source_sha = ""
report_section = "04"
tags = ["vlm", "mpo", "dpo", "dora", "preference", "combined-loss"]

[method]
family = "mpo"
trainer = "DPOTrainer"
peft = "qlora-dora"
upstream_trainer = "DPOTrainer"
execution_trainer = "Trainer"

[model]
base = "Qwen/Qwen2.5-VL-3B-Instruct"
modality = "vlm"

[dataset]
name = "HuggingFaceH4/rlaif-v_formatted"
structure = "conversational"
type = "preference"
has_images = true

[modality_contract]
images_column = "images"
content_list_dict = true
processing_class = "processor"
max_length = "none"

# MPO 不是新 trainer：本质就是 DPOTrainer 上挂多个 loss 的加权组合。
[loss]
types = ["sigmoid", "bco_pair", "sft"]
weights = [0.8, 0.2, 1.0]

# --- wave4 自建偏好协议（非上游 notebook 复现；一手缺失项逐条登记）---
[preference]
protocol = "qwen25vl-mpo-v1"
source_split = "train[:5%]"
held_out_split = "test[:1%]"
split_percent = [80, 10, 10]
split_algorithm = "rlaif-v-preference-split-v1"
loss_types = ["sigmoid", "bco_pair", "sft"]
loss_weights = [0.8, 0.2, 1.0]
ablation_configs = ["full", "sigmoid_only", "no_sft"]
default_config_id = "full"
bf16_training = false
quant_compute_dtype = "bfloat16"
precision_conflict = "DPOConfig 显式 bf16=False，但 4bit 量化 compute dtype=bfloat16；如实登记矛盾，不静默修正"
max_eval_examples = 300
loss = "三项标量 sigmoid/bco_pair/sft 按权重求和；policy/ref 仅在 completion token 上计 logprob，image placeholder 与 padding label=-100"
prompt_format = "system + user(images+prompt)；chosen/rejected 绝不进生成 prompt"
metric_definition = "win_rate/reward_accuracy 均为 policy implicit reward pairwise，不是外部 reward model/human eval"
upstream_install = "git+https://github.com/huggingface/trl.git bitsandbytes qwen-vl-utils==0.0.8；TRL 源码无 commit/revision，其他依赖无 pin"
upstream_seed = "absent（DPOConfig 无 seed/data_seed/deterministic）"
upstream_revision = "absent（from_pretrained/load_dataset 未传 revision）"
upstream_compute_metrics = "absent（有 eval_dataset 但无 compute_metrics）"
upstream_evaluation = "仅 test_dataset[0] 定性展示，无数值指标"
upstream_ref_model = "None"
cross_backbone_attribution_valid = false
self_migration = true

[peft]
r = 8
alpha = 8
dropout = 0.1
target_module_patterns = ["language_model", "_proj"]
use_dora = true
init_lora_weights = "gaussian"
bias = "none"
task_type = "CAUSAL_LM"

[quantization]
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "bfloat16"

[consistency]
train_system_message = true
inference_system_message = true

[baseline]
zero_train = true
result = "unmeasured"
description = "SFT checkpoint 在偏好集上的 win-rate 基线"

[evaluation]
metrics = ["win_rate", "reward_accuracy"]
held_out = true
seed = 42
multi_run = true
compute_metrics = true
max_new_tokens = 96
split = "HuggingFaceH4/rlaif-v_formatted；与 DPO 篇共用同一划分，保证同一偏好 split 可校验；backbone 不同不可归因算法"

[budget]
smoke_steps = 5
full_steps = 200

[known_issues]
items = [
  "因功能尚未进入 official release，上游要求从 GitHub 源码安装 trl，未给出精确版本",
  "标题写 QLoRA，代码 use_dora=True",
  "trl-vlm-alignment 博客的 GSPO 示例中 steps_per_generation 重复两次，Python 会语法报错",
  "SFT 分布在 DPO 后偏移、推理不连贯，是引入 MPO 中 sft 项的动机",
]

[upstream_deviations]
items = [
  "把 loss 组合显式声明为 [loss] 段，避免被误读为新 trainer",
  "tags 显式标注 dora",
  "依赖改为精确 pin 后才允许把 status 推进到 smoke-passed；目前只有 qwen-vl-utils==0.0.8 是上游安装命令里的真实 pin",
]

[todo]
items = [
  "锁定 trl 源码 commit（source_sha / dependencies），替代 git+main 安装",
  "逐项消融 sigmoid / bco_pair / sft 三个分量的贡献，验证 weights 不是随手填的",
  "跑 SFT baseline 并更新 baseline.result",
]

# --- reproducibility audit (generated by scripts/apply_repro_audit.py) ---
[dependencies]
# 14 篇里唯一把精确版本写进 pip install 命令的一篇。
# 上游：!pip install -U -q git+https://github.com/huggingface/trl.git bitsandbytes qwen-vl-utils==0.0.8
qwen-vl-utils = "0.0.8"

[train]
# DPOConfig 原文；bf16=False 与其它 VLM 篇相反。
loss_types = ["sigmoid", "bco_pair", "sft"]
loss_weights = [0.8, 0.2, 1.0]
bf16 = false
num_train_epochs = 1
per_device_train_batch_size = 4
per_device_eval_batch_size = 4
gradient_accumulation_steps = 8
gradient_checkpointing = true
eval_strategy = "steps"
seed = 42
data_seed = 42
# 以下除 loss_types/loss_weights/bf16/epochs/batch/accum/gradient_checkpointing/eval_strategy 外为本仓自建。
fp16 = false
learning_rate = 0.000005
lr_scheduler_type = "linear"
weight_decay = 0.0
eval_steps = 10
save_steps = 10
logging_steps = 10
dataloader_num_workers = 8
seq_length = 1024
remove_unused_columns = false
seed_mechanism = "seed/data_seed 为本仓库定义 baseline 时声明；上游 DPOConfig 无 seed"

[upstream]
split = "dataset train[:5%] / test[:1%]；上游评估仅 test_dataset[0] 单样本定性展示"
mask = "DPOTrainer 组合损失；无显式 image_token_id 屏蔽"
evaluation = "test_dataset[0] 定性展示，无 compute_metrics、无数值"
revision = "from_pretrained/load_dataset 未传 revision"
seed = "DPOConfig 无 seed/data_seed/deterministic"
merge = "未调用 merge_and_unload；本仓 adapter-only 打包"
install = "git+https://github.com/huggingface/trl.git bitsandbytes qwen-vl-utils==0.0.8；TRL 无 commit/revision"
attn = "未固定 attn_implementation"
target_modules = "7 个 LoRA target（use_dora=True）"
trainer = "DPOTrainer（自建协议改用普通 Trainer + 自建三损失，不依赖未固定 TRL 源码）"
processing_class = "processor"


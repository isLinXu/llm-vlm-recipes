schema = 1
id = "vlm/mpo/qwen2-5-vl-3b-mpo"
name = "Qwen2.5-VL-3B + rlaif-v：MPO 组合损失"
status = "ported"
coverage = "params"
confidence = "primary"
source = "https://huggingface.co/learn/cookbook/fine_tuning_vlm_mpo"
source_sha = ""
report_section = "04"
tags = ["vlm", "mpo", "dpo", "dora", "preference", "combined-loss"]

[method]
family = "mpo"
trainer = "DPOTrainer"
peft = "qlora-dora"

[model]
base = "Qwen/Qwen2.5-VL-3B-Instruct"
modality = "vlm"

[dataset]
name = "HuggingFaceH4/rlaif-v_formatted"
structure = "conversational"
type = "preference"
has_images = true

[modality_contract]
images_column = "images"
content_list_dict = true
processing_class = "processor"
max_length = "none"

# MPO 不是新 trainer：本质就是 DPOTrainer 上挂多个 loss 的加权组合。
[loss]
types = ["sigmoid", "bco_pair", "sft"]
weights = [0.8, 0.2, 1.0]

[peft]
use_dora = true

[quantization]
load_in_4bit = true
bnb_4bit_quant_type = "nf4"
bnb_4bit_use_double_quant = true
bnb_4bit_compute_dtype = "bfloat16"

[consistency]
train_system_message = true
inference_system_message = true

[baseline]
zero_train = true
result = "unmeasured"
description = "SFT checkpoint 在偏好集上的 win-rate 基线"

[evaluation]
metrics = ["win_rate", "reward_accuracy"]
held_out = true
seed = 42
multi_run = true
compute_metrics = true
split = "HuggingFaceH4/rlaif-v_formatted；与 DPO 篇共用同一划分，保证 MPO vs DPO 可对照"

[budget]
smoke_steps = 5
full_steps = 200

[known_issues]
items = [
  "因功能尚未进入 official release，上游要求从 GitHub 源码安装 trl，未给出精确版本",
  "标题写 QLoRA，代码 use_dora=True",
  "trl-vlm-alignment 博客的 GSPO 示例中 steps_per_generation 重复两次，Python 会语法报错",
  "SFT 分布在 DPO 后偏移、推理不连贯，是引入 MPO 中 sft 项的动机",
]

[upstream_deviations]
items = [
  "把 loss 组合显式声明为 [loss] 段，避免被误读为新 trainer",
  "tags 显式标注 dora",
  "依赖改为精确 pin 后才允许把 status 推进到 smoke-passed；目前只有 qwen-vl-utils==0.0.8 是上游安装命令里的真实 pin",
]

[todo]
items = [
  "锁定 trl 源码 commit（source_sha / dependencies），替代 git+main 安装",
  "逐项消融 sigmoid / bco_pair / sft 三个分量的贡献，验证 weights 不是随手填的",
  "跑 SFT baseline 并更新 baseline.result",
]

# --- reproducibility audit (generated by scripts/apply_repro_audit.py) ---
[dependencies]
# 14 篇里唯一把精确版本写进 pip install 命令的一篇。
# 上游：!pip install -U -q git+https://github.com/huggingface/trl.git bitsandbytes qwen-vl-utils==0.0.8
qwen-vl-utils = "0.0.8"

[train]
# DPOConfig 原文；bf16=False 与其它 VLM 篇相反。
loss_types = ["sigmoid", "bco_pair", "sft"]
loss_weights = [0.8, 0.2, 1.0]
bf16 = false
num_train_epochs = 1
per_device_train_batch_size = 4
per_device_eval_batch_size = 4
gradient_accumulation_steps = 8
gradient_checkpointing = true
eval_strategy = "steps"
seed = 42
data_seed = 42

[repro]
level = "L1"
assessed_at = "2026-11-13"
assessed_by = "hand-audit + primary-source-check"
evidence_ref = "webfetch:fine_tuning_vlm_mpo"
evidence = ""
note = "loss 组合已显式声明，但权重未做消融"

[repro.code]
state = "missing"
gap = "上游 14 篇均为 .ipynb；本仓库已提供统一 runner，但那是我们自建的执行层，不等于能重放上游 notebook"

[repro.env]
state = "declared"
gap = "qwen-vl-utils==0.0.8 是唯一真实 pin；trl 仍为 git+main 无 commit"

[repro.model]
state = "declared"
gap = "repo id 已按一手材料核实，但 from_pretrained 未传 revision"

[repro.data]
state = "declared"
gap = "repo id 已按一手材料核实，但 load_dataset 未传 revision"

[repro.params]
state = "declared"
gap = "DPOConfig 组合损失与训练超参已按上游页面补齐"

[repro.seed]
state = "missing"
gap = "训练 config 无 seed / data_seed / deterministic"

[repro.eval]
state = "declared"
gap = "有 test[:1%] 与 eval_dataset，但无 compute_metrics、无评估脚本"

[repro.provenance]
state = "declared"
gap = "有上游 HTTPS URL，但 source_sha 为空，notebook 漂移无法定位"

[execution]
command = "python3 runner/train.py --recipe vlm/mpo/qwen2-5-vl-3b-mpo --full"
entrypoint = "../../../../runner/train.py"
lockfile = "../../../../runner/locks/vlm__mpo__qwen2-5-vl-3b-mpo.lock.toml"
eval_script = "../../../../runner/eval.py"
zero_shot_script = "../../../../runner/zero_shot.py"
evidence = "evidence/run.json"
adapter_status = "skeleton：--dry-run 可用；--full 需先按 lock 锁定 revision 并补齐 PEFT / reward / 指标适配，否则 runner 明确拒绝执行"

# --- baseline contract (generated by scripts/apply_baseline_contract.py) ---
[baseline_contract]
state = "B1"
target_tier = "research"
experiment_id = "vlm-mpo-qwen2-5-vl-3b-mpo-v1"
revision_policy = "runner/lock.py --apply@有网环境；锁定时写入 source_sha / model.revision / dataset.revision；本机无外网，当前刻意留空"
determinism = "torch.use_deterministic_algorithms(True, warn_only=True); cudnn.deterministic=True; cudnn.benchmark=False; tf32=disabled; CUBLAS_WORKSPACE_CONFIG=:4096:8"
python_cuda = "python>=3.11,<3.14; torch CUDA build; CUDA 12.x（约束声明，实测版本由 runner/lock.py --apply 写入 lock 文件）"
single_variable = "所有可变超参集中在 [train]；runner 内禁止硬编码；对照实验只改 [train] 一处并保留 diff"
seed_origin = "seed 为本仓库定义 baseline 时声明，上游训练 config 无 seed"

[resources]
gpu = "1× A100 80GB（3B VLM）"
note = "B3 业务档需要实测卡时与显存；此处为预估值，不作为验收依据"

[methodology]
registry = "registry/methodology.toml"
principles = ["dpo_closed_form", "shared_backbone_ablation", "qualitative_only_gap"]
primary_papers = ["dpo", "underspecification", "qlora"]
supplement_papers = ["mpl_mpo"]
stance = "MPO 三损失组合只见二手/TRL release 说明，一手 arXiv 未核到，仅作补充；本仓该篇五维未实现，sigmoid/bco_pair/sft 装配与 shared backbone 对照均未完成。"

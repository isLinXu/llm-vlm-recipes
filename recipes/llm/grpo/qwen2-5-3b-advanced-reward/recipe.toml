assessed_at = "2026-11-13"
assessed_by = "hand-audit + primary-source-check"
evidence_ref = "webfetch:trl_grpo_reasoning_advanced_reward"
evidence = ""
note = "模型与数据集 id 已按原文纠正"

[repro.code]
state = "missing"
gap = "上游 14 篇均为 .ipynb；本仓库已提供统一 runner，但那是我们自建的执行层，不等于能重放上游 notebook"

[repro.env]
state = "missing"
gap = "上游安装命令无任何版本约束"

[repro.model]
state = "declared"
gap = "repo id 已按一手材料核实，但 from_pretrained 未传 revision"

[repro.data]
state = "declared"
gap = "repo id 已按一手材料核实，但 load_dataset 未传 revision"

[repro.params]
state = "missing"
gap = "四个 reward 分值已核实，但 GRPOConfig 训练超参上游仍未逐项录入"

[repro.seed]
state = "missing"
gap = "训练 config 无 seed / data_seed / deterministic"

[repro.eval]
state = "declared"
gap = "有评估协议；上游仅单题 expected_answer='72' 的格式检查"

[repro.provenance]
state = "declared"
gap = "有上游 HTTPS URL，但 source_sha 为空，notebook 漂移无法定位"

# 全部显式冻结：上游 GRPOConfig 超参未逐项录入，下列取值是本仓选择，不是上游数值。
# 全参数 fp32 权重 + bf16 autocast；use_vllm 显式 false（vLLM 对照属另一篇配方）。
[train]
learning_rate = 5e-6
lr_scheduler_type = "cosine"
warmup_ratio = 0.1
weight_decay = 0.1
max_grad_norm = 0.1
beta = 0.04
temperature = 0.9
num_generations = 4
max_prompt_length = 512
max_completion_length = 256
per_device_train_batch_size = 4
gradient_accumulation_steps = 8
num_train_epochs = 1
bf16 = true
gradient_checkpointing = false
use_vllm = false
remove_unused_columns = false
logging_steps = 1
save_strategy = "no"
seed = 42
data_seed = 42

[execution]
task_id = "gsm8k-reward-v1"
config_id = "full"
command = "python3 runner/train.py --recipe llm/grpo/qwen2-5-3b-advanced-reward --full"
entrypoint = "../../../../runner/train.py"
lockfile = "../../../../runner/locks/llm__grpo__qwen2-5-3b-advanced-reward.lock.toml"
eval_script = "../../../../runner/eval.py"
zero_shot_script = "../../../../runner/zero_shot.py"
evidence = "evidence/run.json"
adapter_status = "unverified：gsm8k-reward-v1 五维代码及 offline 测试已覆盖（四 reward、#### gold 剥离、独立严格 verifier、reward hacking 诊断；5 个 drop-one reward 消融 × 独立训练 seed 的 gsm8k_suite；整模型 safetensors 离线复载的 gsm8k_export），task_router 精确注册；完整 CUDA 环境、冻结 revision、真实数据、GPU 实跑与预声明容差均未完成，不是 baseline"

# --- baseline contract (generated by scripts/apply_baseline_contract.py) ---
[baseline_contract]
state = "B1"
target_tier = "research"
experiment_id = "llm-grpo-qwen2-5-3b-advanced-reward-v1"
revision_policy = "runner/lock.py --apply@有网环境；锁定时写入 source_sha / model.revision / dataset.revision；本机无外网，当前刻意留空"
determinism = "torch.use_deterministic_algorithms(True, warn_only=True); cudnn.deterministic=True; cudnn.benchmark=False; tf32=disabled; CUBLAS_WORKSPACE_CONFIG=:4096:8"
python_cuda = "python>=3.11,<3.14; torch CUDA build; CUDA 12.x（约束声明，实测版本由 runner/lock.py --apply 写入 lock 文件）"
single_variable = "所有可变超参集中在 [train]；runner 内禁止硬编码；对照实验只改 [train] 一处并保留 diff"
seed_origin = "seed 为本仓库定义 baseline 时声明，上游训练 config 无 seed"

[resources]
gpu = "1× A100 80GB（3B GRPO）"
note = "B3 业务档需要实测卡时与显存；此处为预估值，不作为验收依据"

[methodology]
registry = "registry/methodology.toml"
principles = ["reward_hacking_needs_independent_metric", "multiseed_underspecification", "self_consistency_not_for_repro"]
primary_papers = ["reward_overopt", "underspecification", "self_consistency"]
supplement_papers = []
stance = "四 reward 与 GSM8K 消融的方法论动机是 reward 过优化与欠规范；本仓五维已实装：gold 剥离、独立严格 verifier、reward hacking 诊断，5 个 drop-one 消融（full/no_format_exact/no_format_approx/no_correctness/no_extraction）× 独立训练 seed 的套件与整模型离线复载；四函数等权相加未经归一化，消融只在同一 backbone 内，reward hacking 诊断只是信号。"

schema = 1
id = "llm/grpo/qwen2-5-3b-advanced-reward"
name = "Qwen2.5-3B + GSM8K：四函数渐进式 reward 工程"
status = "ported"
coverage = "params"
confidence = "primary"
source = "https://huggingface.co/learn/cookbook/trl_grpo_reasoning_advanced_reward"
source_sha = ""
report_section = "05"
tags = ["llm", "grpo", "rl", "reward-engineering", "gsm8k"]

[method]
family = "grpo"
trainer = "GRPOTrainer"

[model]
base = "Qwen/Qwen2.5-3B-Instruct"
params_b = 3.0
modality = "llm"

[dataset]
name = "openai/gsm8k"
structure = "conversational"
type = "prompt-only"
config = "main"
split = "train"

[rewards]
functions = [
  "match_format_exactly",
  "match_format_approximately",
  "check_answer_correctness",
  "check_numbers_extraction",
]
failure_path_tested = true
failure_path_note = "四函数分别覆盖硬格式、软格式、答案正确性、数字抽取；必须分别验证空输出、格式错、答案错、抽取失败四条路径，避免奖励黑客"

[[rewards.spec]]
name = "match_format_exactly"
max_score = 3.0
note = "完全匹配格式给 3.0"

[[rewards.spec]]
name = "match_format_approximately"
max_score = 2.0
note = "每个期望 token ±0.5，累计上限 +2.0"

[[rewards.spec]]
name = "check_answer_correctness"
max_score = 3.0
note = "3.0 / 1.5 / 0.5 / -0.5 四档"

[[rewards.spec]]
name = "check_numbers_extraction"
max_score = 1.5
note = "能从输出中抽出数字即给分"

[baseline]
zero_train = true
result = "unmeasured"
description = "原模型 GSM8K pass@1 与格式合规率"

[evaluation]
metrics = ["pass@1", "format_compliance", "reward_hacking_rate"]
held_out = true
seed = 42
multi_run = true
compute_metrics = true
split = "openai/gsm8k 官方 train/test；baseline 用官方 test 全量"

[budget]
smoke_steps = 5
full_steps = 150

[notes]
items = [
  "从 2 个二值 reward 升级到 4 个渐进打分，目的是给稀疏奖励提供稠密形状信号",
  "软格式奖励同时有正负项，需检查总 reward 不会被格式刷分主导",
]

[known_issues]
items = [
  "上游依赖精确版本未给出",
  "四个函数的分值上限差异较大，未做量纲归一化或消融",
  "没有报告 reward 曲线与独立 pass@1 是否背离",
]

[upstream_deviations]
items = [
  "把每个 reward 的分值与语义写入 [[rewards.spec]]，可被规则与文档共同消费",
  "evaluation 增加 reward_hacking_rate，监控 reward 上升但准确率不动的情况",
]

[todo]
items = [
  "补齐 trl / transformers / math_verify 精确版本",
  "为每个 reward 函数写独立的路径单测（含空输出与解析失败）",
  "做一次四函数消融，确认权重不是随手设定",
]

# --- reproducibility audit (generated by scripts/apply_repro_audit.py) ---
[repro]
level = "L0"
assessed_at = "2026-11-13"
assessed_by = "hand-audit + primary-source-check"
evidence_ref = "webfetch:trl_grpo_reasoning_advanced_reward"
evidence = ""
note = "模型与数据集 id 已按原文纠正"

[repro.code]
state = "missing"
gap = "上游 14 篇均为 .ipynb；本仓库已提供统一 runner，但那是我们自建的执行层，不等于能重放上游 notebook"

[repro.env]
state = "missing"
gap = "上游安装命令无任何版本约束"

[repro.model]
state = "declared"
gap = "repo id 已按一手材料核实，但 from_pretrained 未传 revision"

[repro.data]
state = "declared"
gap = "repo id 已按一手材料核实，但 load_dataset 未传 revision"

[repro.params]
state = "missing"
gap = "四个 reward 分值已核实，但 GRPOConfig 训练超参上游仍未逐项录入"

[repro.seed]
state = "missing"
gap = "训练 config 无 seed / data_seed / deterministic"

[repro.eval]
state = "declared"
gap = "有评估协议；上游仅单题 expected_answer='72' 的格式检查"

[repro.provenance]
state = "declared"
gap = "有上游 HTTPS URL，但 source_sha 为空，notebook 漂移无法定位"

[train]
seed = 42
data_seed = 42

[execution]
command = "python3 runner/train.py --recipe llm/grpo/qwen2-5-3b-advanced-reward --full"
entrypoint = "../../../../runner/train.py"
lockfile = "../../../../runner/locks/llm__grpo__qwen2-5-3b-advanced-reward.lock.toml"
eval_script = "../../../../runner/eval.py"
zero_shot_script = "../../../../runner/zero_shot.py"
evidence = "evidence/run.json"
adapter_status = "skeleton：--dry-run 可用；--full 需先按 lock 锁定 revision 并补齐 PEFT / reward / 指标适配，否则 runner 明确拒绝执行"

# --- baseline contract (generated by scripts/apply_baseline_contract.py) ---
[baseline_contract]
state = "B1"
target_tier = "research"
experiment_id = "llm-grpo-qwen2-5-3b-advanced-reward-v1"
revision_policy = "runner/lock.py --apply@有网环境；锁定时写入 source_sha / model.revision / dataset.revision；本机无外网，当前刻意留空"
determinism = "torch.use_deterministic_algorithms(True, warn_only=True); cudnn.deterministic=True; cudnn.benchmark=False; tf32=disabled; CUBLAS_WORKSPACE_CONFIG=:4096:8"
python_cuda = "python>=3.11,<3.14; torch CUDA build; CUDA 12.x（约束声明，实测版本由 runner/lock.py --apply 写入 lock 文件）"
single_variable = "所有可变超参集中在 [train]；runner 内禁止硬编码；对照实验只改 [train] 一处并保留 diff"
seed_origin = "seed 为本仓库定义 baseline 时声明，上游训练 config 无 seed"

[resources]
gpu = "1× A100 80GB（3B GRPO）"
note = "B3 业务档需要实测卡时与显存；此处为预估值，不作为验收依据"

[methodology]
registry = "registry/methodology.toml"
principles = ["reward_hacking_needs_independent_metric", "multiseed_underspecification", "self_consistency_not_for_repro"]
primary_papers = ["reward_overopt", "underspecification", "self_consistency"]
supplement_papers = []
stance = "四 reward 与 GSM8K 消融的方法论动机是 reward 过优化与欠规范；本仓五维未实现，gold 剥离、verifier、reward hacking 诊断均缺。"

schema = 1
id = "llm/grpo/qwen2-5-3b-advanced-reward"
name = "Qwen2.5-3B + GSM8K：四函数渐进式 reward 工程"
status = "ported"
coverage = "params"
confidence = "primary"
source = "https://huggingface.co/learn/cookbook/trl_grpo_reasoning_advanced_reward"
source_sha = ""
report_section = "05"
tags = ["llm", "grpo", "rl", "reward-engineering", "gsm8k"]

[method]
family = "grpo"
trainer = "GRPOTrainer"

[model]
base = "Qwen/Qwen2.5-3B-Instruct"
params_b = 3.0
modality = "llm"

[dataset]
name = "openai/gsm8k"
structure = "conversational"
type = "prompt-only"
config = "main"
split = "train"

# 本仓选择的精确版本（沿用同 Cookbook GRPO 族数学配方的 pin），不是上游对本 notebook 的核实：
# 上游安装命令无任何版本约束。不使用 peft / math_verify / vLLM。
[dependencies]
trl = "0.14.0"
transformers = "4.47.1"
datasets = "3.2.0"
accelerate = "1.2.1"

[rewards]
functions = [
  "match_format_exactly",
  "match_format_approximately",
  "check_answer_correctness",
  "check_numbers_extraction",
]
failure_path_tested = true
failure_path_note = "四函数分别覆盖硬格式、软格式、答案正确性、数字抽取；必须分别验证空输出、格式错、答案错、抽取失败四条路径，避免奖励黑客"

[[rewards.spec]]
name = "match_format_exactly"
max_score = 3.0
note = "完全匹配格式给 3.0"

[[rewards.spec]]
name = "match_format_approximately"
max_score = 2.0
note = "每个期望 token ±0.5，累计上限 +2.0"

[[rewards.spec]]
name = "check_answer_correctness"
max_score = 3.0
note = "3.0 / 1.5 / 0.5 / -0.5 四档"

[[rewards.spec]]
name = "check_numbers_extraction"
max_score = 1.5
note = "能从输出中抽出数字即给分"

[baseline]
zero_train = true
result = "unmeasured"
description = "原模型 GSM8K pass@1 与格式合规率"

[evaluation]
metrics = ["pass@1", "format_compliance", "reward_hacking_rate"]
held_out = true
seed = 42
multi_run = true
compute_metrics = true
split = "官方 train 按规范化 question hash 90/10 切 train/validation；官方 test 1319 题整体冻结为 held-out（gsm8k-reward-v1，本仓自建，非上游复现）"

# 本仓自建 gsm8k-reward-v1 协议（data/train/eval 三维）；段内数值与 gsm8k_task.py 常量逐项校验，
# 且整段进入 fingerprint。上游只核实了四个 reward 名与分值上限、数据集与单题格式检查。
[gsm8k]
protocol = "gsm8k-reward-v1"
split_rule = "官方 train 按 sha256(data_seed:NFKC 空白折叠后的 question) 取模 100，小于 validation_percent 为 validation，其余 train；官方 test 整体 held-out，任何题与 train/validation 重复即拒绝"
validation_percent = 10
official_train_rows = 7473
official_test_rows = 1319
gold_delimiter = "####"
near_miss_relative_tolerance = 0.1
accuracy_definition = "pass@1 = 严格全文格式 <think>..</think><answer>..</answer> 且 answer 为单个数字并与 #### 之后的规范化 gold 数值精确相等（Decimal，不用 math_verify，也不用 reward 的 0.5 近似档）；greedy 单样本"
reward_hacking_definition = "reward_hacking_rate = 三项格式分（match_format_exactly=3.0、match_format_approximately=2.0、check_numbers_extraction=1.5）均满额但独立严格 verifier 判错的样本占比；只是诊断信号，不能单独证明或排除 reward hacking"

[budget]
smoke_steps = 5
full_steps = 150

[notes]
items = [
  "从 2 个二值 reward 升级到 4 个渐进打分，目的是给稀疏奖励提供稠密形状信号",
  "软格式奖励同时有正负项，需检查总 reward 不会被格式刷分主导",
]

[known_issues]
items = [
  "上游依赖精确版本未给出",
  "四个函数的分值上限差异较大，未做量纲归一化或消融",
  "没有报告 reward 曲线与独立 pass@1 是否背离",
]

[upstream_deviations]
items = [
  "把每个 reward 的分值与语义写入 [[rewards.spec]]，可被规则与文档共同消费",
  "evaluation 增加 reward_hacking_rate，监控 reward 上升但准确率不动的情况",
  "本仓自建 gsm8k-reward-v1（非上游复现）：gold 取自 #### 之后并规范化为数值，推理文本不进 prompt；官方 train 按 question hash 90/10 切 train/validation，官方 test 1319 题整体 held-out；上游无 held-out 指标与训练 seed",
  "标签格式 <think>/<answer>、correctness 分档条件（3.0 文本精确 / 1.5 数值相等 / 0.5 相对误差 ≤10% / -0.5 其余）、soft format 逐 token ±0.5 计数、numbers extraction 限定 <answer> 块内单个数字，均为本仓选择；分值上限沿用 recipe 已核实的 3.0/2.0/3.0/1.5。本轮一手页面未能重新取回，具体分档与标签须回一手页面核对后才能称与上游一致",
  "GRPOConfig 超参（lr/beta/temperature/num_generations/长度/batch/累积/调度/bf16 等）全部显式冻结，是本仓选择，不是上游数值",
  "评估用独立严格数值 verifier（Decimal，不依赖 math_verify），不复用 reward 的 0.5 近似档，使 reward 与 pass@1 可相互独立诊断",
]

[todo]
items = [
  "冻结 model/dataset revision、source_sha 与完整 CUDA 安装环境锁（lock 仍为模板）；不把声明版本当 GPU 兼容确认",
  "回一手页面核对四个 reward 的分档/标签/超参，再决定哪些本仓选择需要改回上游值",
  "授权 Linux CUDA 环境锁定 revision 与 frozen environment 后，真实跑 5 消融 × 3 seed 套件与 HF offline 导出复载；预声明 export_tolerance 后再验收",
  "GPU 完成 zero-shot/smoke/full 与真实 GSM8K 官方行数、gold 解析与跨 split 去重验证；失败不放宽门槛",
]


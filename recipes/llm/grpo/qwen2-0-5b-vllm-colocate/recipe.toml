schema = 1
id = "llm/grpo/qwen2-0-5b-vllm-colocate"
name = "Qwen2-0.5B：GRPO + vLLM colocate 在线生成加速"
status = "ported"
coverage = "params"
confidence = "primary"
source = "https://huggingface.co/learn/cookbook/grpo_vllm_online_training"
source_sha = ""
report_section = "05"
tags = ["llm", "grpo", "rl", "vllm", "colocate", "throughput"]

[method]
family = "grpo"
trainer = "GRPOTrainer"

[model]
base = "Qwen/Qwen2-0.5B-Instruct"
params_b = 0.5
modality = "llm"

[dataset]
name = "AI-MO/NuminaMath-TIR"
structure = "conversational"
type = "prompt-only"

[dependencies]
trl = "0.23.1"
transformers = "4.57.0"
vllm = "0.11.0"
peft = "0.17.1"
math_verify = "0.8.0"
trackio = "0.5.2"

[vllm]
use_vllm = true
mode = "colocate"
# 0.3 只出现在上游注释（默认值说明），未作为显式实参传入。
default_note_gpu_memory_utilization = 0.3
tensor_parallel_size = 1

[train]
num_generations = 8
max_completion_length = 512
max_prompt_length = 512
seed = 42
data_seed = 42

[benchmark]
throughput_with_vllm_its = 0.07
throughput_without_vllm_its = 0.04
speedup_512 = "+75%"
speedup_1024 = "+100%"
note = "max_completion_length=1024 时为 0.04 vs 0.02 it/s；瓶颈是 rollout 生成而非梯度"

[rewards]
functions = ["format_reward", "accuracy_reward"]
failure_path_tested = true
failure_path_note = "已核实：基础 GRPO 篇 accuracy_reward 在 gold 解析失败时 rewards.append(1.0)（给满分），不是返回 None；这是上游缺陷"

[baseline]
zero_train = true
result = "unmeasured"
description = "原模型 pass@1；同时记录关闭 vLLM 时的吞吐作为工程基线"

[evaluation]
metrics = ["pass@1", "tokens_per_second", "gpu_memory_peak_gb"]
held_out = true
seed = 42
multi_run = true
compute_metrics = true
split = "AI-MO/NuminaMath-TIR train；与 numinamath 篇共用同一 held-out 索引（本仓库定义，保证可对照）"

[budget]
smoke_steps = 5
full_steps = 150

[notes]
items = [
  "colocate：trainer 与 vLLM 同进程共享 GPU，适合单卡 / Colab",
  "server：vLLM 独立进程或独立 GPU，HTTP 通信，适合多卡 / 多节点",
  "gpu_memory_utilization 需与训练显存留出余量；0.3 仅见于上游注释的默认值说明，未作为显式实参",
]

[known_issues]
items = [
  "vLLM 在 IPython / notebook 内核下初始化会与已有 CUDA context 冲突",
  "上游只报 it/s，没有报告 pass@1 是否因 vLLM 采样差异而变化",
]

[upstream_deviations]
items = [
  "把吞吐对照与质量指标一起纳入 evaluation，避免只优化速度而悄悄掉点",
  "smoke 与 full 双档预算显式化",
]

[todo]
items = [
  "在脚本（非 notebook）内核下复现 colocate 吞吐数字",
  "补齐 server 模式的对照 recipe",
  "跑零训练基线并更新 baseline.result",
]


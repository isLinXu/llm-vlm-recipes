schema = 1
id = "llm/grpo/qwen2-0-5b-numinamath"
name = "Qwen2-0.5B + NuminaMath-TIR：GRPO 最小基线"
status = "ported"
coverage = "params"
confidence = "primary"
source = "https://huggingface.co/learn/cookbook/fine_tuning_llm_grpo_trl"
source_sha = ""
report_section = "05"
tags = ["llm", "grpo", "rl", "math", "minimal"]

[method]
family = "grpo"
trainer = "GRPOTrainer"

[model]
base = "Qwen/Qwen2-0.5B-Instruct"
params_b = 0.5
modality = "llm"

[dataset]
name = "AI-MO/NuminaMath-TIR"
structure = "conversational"
type = "prompt-only"

[dependencies]
trl = "0.14.0"
transformers = "4.47.1"
datasets = "3.2.0"
peft = "0.14.0"
accelerate = "1.2.1"
math_verify = "0.3.3"

[train]
per_device_train_batch_size = 4
learning_rate = 1e-5
gradient_accumulation_steps = 16
num_train_epochs = 1
max_completion_length = 64
num_generations = 4
remove_unused_columns = false
seed = 42
data_seed = 42

[rewards]
functions = ["format_reward", "accuracy_reward"]
failure_path_tested = true
failure_path_note = "上游gold解析为空给满分属于已核实缺陷；本仓库math_task已修正为DatasetValidationError，预测空/格式错/解析或验证异常为0，离线正反向单测覆盖，未在实际数据/GPU确认"
format_regex = '^<think>.*?</think>\s*<answer>.*?</answer>$'
verifier = "math_verify"

[baseline]
zero_train = true
result = "unmeasured"
description = "原模型在 held-out 数学集上的 pass@1"

[evaluation]
metrics = ["pass@1", "format_compliance"]
held_out = true
seed = 42
multi_run = true
compute_metrics = true
split = "train[0:500] / validation=train[500:1000] / test=train[1000:1500]；math-grpo-v1固定连续索引，跨split题目/内容去重失败即拒绝（本仓库定义，非上游复现）"

[budget]
smoke_steps = 5
full_steps = 150

[known_issues]
items = [
  "上游注释给出 6 个测试版本，但安装命令为 -U 无 pin，仍不可重放",
  "评估以单样本定性生成收尾，没有 compute_metrics",
  "GRPO 无 value model，组内相对奖励对 num_generations 敏感，小批量方差大",
]

[upstream_deviations]
items = [
  "补 held-out 定量评估 + 固定 seed + 多次运行",
  "把 reward 正则与 verifier 显式声明，便于跨 recipe 对齐",
]

[todo]
items = [
  "冻结输入commit与完整实际CUDA安装环境；本任务不使用vLLM，不把声明版本当GPU兼容确认",
  "在实际NuminaMath前1500条验证gold解析与跨split去重；失败不放宽门槛",
  "GPU完成zero-shot/smoke/full及至少3个独立训练seed对照；suite/export已有离线代码，仍需实测验收", 
  "回填真实零训练测量文件、指标容差与baseline-suite；不以mock测试冒充训练", 
]


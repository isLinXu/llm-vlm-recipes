# 上游 dataclass 默认值：仅作一手元信息，不参与本仓执行层 config_kwargs。
[upstream]
defaults_from = "TrainingConfig dataclass"
seed_note = "上游训练 config 无 seed；generate_function_call 用 do_sample=True, temperature=0.7，样例 max_new_tokens=512"
max_steps = 1000
max_seq_length = 2048
save_steps = 250
logging_steps = 10
warmup_ratio = 0.1
dataset_text_field = "text"
evaluation = "无 eval_dataset / compute_metrics；仅3条定性样例"

# --- reproducibility audit (generated by scripts/apply_repro_audit.py) ---
# 本仓自建受控协议参数；上游 dataclass 默认值见 [upstream]，不要在实跑时混用。
[train]
seed = 42
data_seed = 42
seed_mechanism = "本仓定义：上游 TrainingConfig/SFTConfig 无 seed；所有随机性由 train.seed / train.data_seed / evaluation.seed 显式固定"
learning_rate = 1e-4
per_device_train_batch_size = 16
per_device_eval_batch_size = 16
gradient_accumulation_steps = 8
max_steps = 150
seq_length = 2048
lr_scheduler_type = "linear"
weight_decay = 0.0
warmup_ratio = 0.1
eval_steps = 25
save_steps = 25
logging_steps = 10
bf16 = true
fp16 = false
optim = "adamw_8bit"
lora_r = 16
lora_alpha = 16
lora_dropout = 0.05
gradient_checkpointing = true
dataloader_num_workers = 0
remove_unused_columns = false

# 自建数据/输出协议，不是上游 notebook 的字节复现。
[xlam]
protocol = "xlam-fc-v1"
source_split = "train"
query_column = "query"
tools_column = "tools"
answers_column = "answers"
split_percent = [80, 10, 10]
split_algorithm = "sha256_json({query,tools,answers,data_seed,protocol}) modulo 100"
duplicate_policy = "全局拒绝规范化内容重复，包含跨 split；gold 不进 prompt"
normalization = "JSON 解析后按键排序重新序列化；字符串不做 strip/大小写归一，保留原始内容"
loss = "completion-only：仅 <calls> 严格JSON数组 </calls> + EOS 参与 causal loss，prompt 部分 label=-100"
output_format = "strict-json-array"
prompt_format = "<user>{query}</user>\\n\\n<tools>{tools_json}</tools>\\n\\n"
target_format = "<calls>{answers_json}</calls>{eos}"
tool_validation = "answers.name 必须在 tools.name 内；arguments 键必须在对应 tool.parameters 内；required 参数必须存在；类型与 schema 一致；拒绝同名工具与多余参数"
max_eval_examples = 300
upstream_quantitative_evaluation = false

[peft]
r = 16
alpha = 16
dropout = 0.05
target_modules = ["k_proj", "q_proj", "v_proj", "o_proj", "gate_proj", "down_proj", "up_proj"]
bias = "none"
task_type = "CAUSAL_LM"

[quantization]
load_in_4bit = true
quant_type = "nf4"
compute_dtype = "bfloat16"
double_quant = true


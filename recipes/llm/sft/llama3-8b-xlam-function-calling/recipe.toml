schema = 1
id = "llm/sft/llama3-8b-xlam-function-calling"
name = "Llama-3-8B + xLAM-60k：function calling QLoRA SFT"
status = "cataloged"
coverage = "catalog"
confidence = "primary"
source = "https://huggingface.co/learn/cookbook/function_calling_fine_tuning_llms_on_xlam"
source_sha = ""
report_section = "05"
tags = ["llm", "sft", "qlora", "function-calling", "structured-output"]

[method]
family = "sft"
# 本仓执行层用 transformers.Trainer + 自建 completion-only collator；
# upstream_trainer 保留一手事实：上游 notebook 用 SFTTrainer(dataset_text_field="text") 对整段文本做损失。
trainer = "Trainer"
upstream_trainer = "SFTTrainer"
peft = "qlora"

[model]
base = "meta-llama/Meta-Llama-3-8B-Instruct"
params_b = 8.0
modality = "llm"

[dataset]
name = "Salesforce/xlam-function-calling-60k"
structure = "conversational"
type = "prompt-completion"
kind = "static"
has_images = false

[baseline]
zero_train = true
result = "unmeasured"
description = "同一内容级held-out样本与完整tool schema下，基座zero-shot与训练后checkpoint的json_parse_rate / schema_valid_rate / tool_call_exact_match / argument_f1；严格JSON输出协议，不执行任何生成的调用，不把合法率冒充真实API执行正确率"

[notes]
items = [
  "输出协议型任务，是「SFT 值得做」的典型场景：缺口在格式与调用协议，不在知识",
  "评估应看 tool name / argument schema / JSON 可解析性，而不是生成文本的流畅度",
  "一手数据卡字段：query(str) / tools(JSON字符串数组) / answers(JSON字符串数组)；tools元素为 name,description,parameters{param:{type,description,required}}，answers元素为 name,arguments",
  "数据卡为 gated：须接受条款并登录；声明 research purposes only；2024-07 曾重生成 1896 条，未冻结 revision 时输入可漂移",
]

[known_issues]
items = [
  "上游评估为定性展示：只有3条 do_sample=True/temperature=0.7 的样例，无 held-out / eval_dataset / compute_metrics / 定量数字",
  "上游 process_xlam_sample 把 answers(gold) 拼进 dataset_text_field='text' 并由 SFTTrainer 对整段（含 query/tools）计算损失；没有 completion-only loss 或 response template",
  "上游推理 prompt 截断为 '<user>...</user>\\n\\n<tools>'，未给出完整候选工具定义；本仓自建协议必须给全 tools，否则 schema 合法率不可解释",
  "上游展示输出是 Python str(dict) 单引号字面量，不是合法 JSON；本仓自建严格 JSON 数组协议，绝不 eval 生成文本",
  "安装单元格整行被注释（# !uv pip install --upgrade ...），且 setup_hardware_config() 运行时 os.system 动态装 flash_attn；上游无 seed 与 revision pin，并启用 trust_remote_code=True",
  "上游 bitsandbytes 具体配置未在页面展示；本仓 [quantization] 是自建声明，不声称与上游字节一致",
]

[todo]
items = [

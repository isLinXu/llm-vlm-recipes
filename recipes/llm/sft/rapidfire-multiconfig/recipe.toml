schema = 1
id = "llm/sft/rapidfire-multiconfig"
name = "RapidFire：并发多配置 SFT / 轻量 HPO（本仓自建无泄漏顺序协议）"
status = "cataloged"
coverage = "catalog"
confidence = "primary"
source = "https://huggingface.co/learn/cookbook/rapidfire_sft_multiconfig_training"
source_sha = ""
report_section = "05"
tags = ["llm", "hpo", "sft", "multi-config", "data-leakage-risk"]

[method]
family = "hpo"
# 上游用 rapidfireai 的 Experiment.run_fit + RFGridSearch 并发调度 4 配置；本仓不重放该外部服务，
# 改用 transformers.Trainer + 自建 completion-only collator，按配置逐个顺序执行并独立落证据。
trainer = "Trainer"
upstream_trainer = "Experiment.run_fit / RFSFTConfig"
peft = "lora"

[model]
base = "gpt2"
params_b = 0.124
modality = "llm"

[dataset]
name = "bitext/Bitext-customer-support-llm-chatbot-training-dataset"
structure = "standard"
type = "prompt-completion"
kind = "static"
has_images = false

[baseline]
zero_train = true
result = "unmeasured"
description = "同一内容 hash 隔离的 held-out test、同一 greedy 解码协议下，比较 base zero-shot 与各配置训练后 checkpoint 的 rouge_l / exact_match；4 配置各自独立输出，禁止用训练内记忆分数作泛化结论"

[notes]
items = [
  "定位是编排层：上游由 rapidfireai 并发跑 4 组超参；本仓顺序执行 4 配置，逐配置独立目录/证据，不声称复现上游 chunk 调度或 16-24× 吞吐声明",
  "一手数据卡：26872 条问答对，仅 train split；列为 flags/instruction/category/intent/response；卡片未给 license，仅 (c) Bitext Innovations, 2024",
  "上游 sample_formatting_function 输出 'Question: {instruction}\\nAnswer: {response}' 整段文本并交给 RFSFTConfig 做 SFT；未用 response_template，gold 进入训练输入与损失",
  "上游 sample_compute_metrics 直接把 eval_preds 的 predictions/labels 传给 evaluate.load('rouge')，未见 decode；页面从未报告任何 rougeL / loss 数值，异常时静默返回 {}",
]

[known_issues]
items = [
  "上游 eval range(50,60) 落在 train range(64) 内，属数据泄漏，评估结论无效",
  "上游有 sample_compute_metrics（ROUGE-L）但从未报告任何实际数值；且评估集与训练集重叠、未见 token id 解码",
  "上游 model/dataset 均无 revision pin；%pip install rapidfireai 无版本；rapidfireai init/start 启动本地服务与 InteractiveController，均不可重放",
  "上游只在 shuffle(seed=42) 与 run_fit(seed=42) 出现 seed，无 set_seed / RFSFTConfig.seed / deterministic 策略",
  "上游 4 配置的 lr_scheduler_type 与 warmup_steps 不对称：linear 组未写 warmup，cosine 组 warmup_steps=10；本仓把差异显式登记为配置字段，不做隐式默认",
]

[upstream_deviations]
items = [
  "按规范化问题 hash 做 80/10/10 三段不重叠划分，同题所有生成变体落同一 split；全局拒绝规范化内容重复；绝不借用上游 range(64)/range(50,60)",
  "prompt 只到 'Answer:'，gold 只进入 completion-only target 与评估 gold，绝不进入生成输入",
  "自建纯 Python 无 stemmer 的 LCS ROUGE-L 与 exact_match，不引入未冻结版本的 evaluate/rouge_score；数值与上游 use_stemmer=True 的 rougeL 不可比",
  "顺序执行 4 配置、每配置独立 seed 与输出目录；不与上游并发调度、TensorBoard 曲线或加速声明作数值对照",
  "训练用右 padding（上游设 padding_side='left' 便于生成）；评估为单样本 greedy，无需 padding",
]

[todo]
items = [
  "锁定真实 model/dataset/source commit 与完整 CUDA 环境；数据卡未给 license，商业使用与再分发权限未确认",
  "comparison/export 两维代码已按 ADR-019 补齐（4 配置 × 3 独立 seed 严格聚合、只用 validation 选配置、test 单次验收、选中 adapter 的 HF offline 新进程复载）；仍缺真实 CUDA 实跑与预声明 export_tolerance，--full 导出失败关闭、不回填容差",
  "真实 CUDA 实跑三独立 seed、真实 GPU 导出复载、冻结 model/dataset/source revision 与可安装镜像锁、业务验收；当前只有隔离离线合成证据，B1 不晋级",
  "上游 16-24× 加速声明不是训练指标；若要比较编排收益，需另建同预算并发/顺序消融，不能从本仓顺序执行推出",
]

# 上游事实只作元信息，不参与本仓 config_kwargs；不得把自建参数冒充上游原值。
[upstream]
defaults_from = "rapidfireai.fit.automl RFSFTConfig / RFLoraConfig"
install = "%pip install rapidfireai（无版本）；rapidfireai init；subprocess.Popen(['rapidfireai','start'])"
run_fit = "experiment.run_fit(config_group, sample_create_model, train_dataset, eval_dataset, num_chunks=4, seed=42)"
train_range = "range(64)"
eval_range = "range(50, 60)"
max_steps = 64
learning_rates = [5e-4, 2e-4]
lora_ranks = [8, 32]
num_chunks = 4
seed_note = "仅 shuffle(seed=42) 与 run_fit(seed=42)；无 set_seed / 配置内 seed / deterministic"
evaluation = "eval_dataset ⊂ train_dataset；compute_metrics 定义 ROUGE-L(use_stemmer=True) 但页面未报告任何数值"

# --- reproducibility audit (generated by scripts/apply_repro_audit.py) ---
[train]
seed = 42
data_seed = 42
seed_mechanism = "本仓定义：上游只在 shuffle/run_fit 用 seed=42；train.seed / train.data_seed / evaluation.seed 由本仓显式固定且互相独立"
learning_rate = 5e-4
lr_scheduler_type = "linear"
warmup_steps = 0
per_device_train_batch_size = 2
per_device_eval_batch_size = 2
gradient_accumulation_steps = 2
max_steps = 64
seq_length = 512
weight_decay = 0.0
eval_steps = 4
save_steps = 4
logging_steps = 2
fp16 = true
bf16 = false
optim = "adamw_torch"
lora_r = 8
lora_alpha = 16
lora_dropout = 0.1
gradient_checkpointing = true
dataloader_num_workers = 0
remove_unused_columns = false

# 自建数据/输出协议，不是上游 notebook 的字节复现。
[rapidfire]
protocol = "rapidfire-sft-v1"
base_experiment_id = "llm-sft-rapidfire-multiconfig-v1"
source_split = "train"
instruction_column = "instruction"
response_column = "response"
metadata_columns = ["flags", "category", "intent"]
split_percent = [80, 10, 10]
split_algorithm = "sha256_json({normalized_instruction,data_seed,protocol}) modulo 100；同题所有变体同 split"
duplicate_policy = "全局拒绝规范化(instruction,response)内容重复；问题 hash 决定 split，禁止跨 split 泄漏"
normalization = "内容原文保留；问题隔离 hash 用 NFKC + casefold + 空白折叠；不使用 strip 修改训练文本"
loss = "completion-only：' {response}'+EOS 参与 causal loss，prompt 部分 label=-100"
prompt_format = "Question: {instruction}\nAnswer:"
target_format = " {response}{eos}"
metric_definition = "rouge_l = 纯Python LCS-F1（NFKC+casefold+正则取词、无 stemmer）；exact_match = 同规则归一化后全串相等；与上游 evaluate.load('rouge', use_stemmer=True) 数值不可比"
generation_truncation = "首个 EOS 之后的内容丢弃，再 strip；空生成不得给分"
max_eval_examples = 300
max_validation_examples = 300
concurrent_scheduling = false
upstream_quantitative_evaluation = false
selection_policy = "只用 validation 的 3 个独立训练 seed paired rouge_l 均值选配置；test 仅在选中配置上做一次最终验收；平局按 config_id 字典序；test 结果不得回流选择"

# 4 组配置按上游原文交叉：2 个 lr/scheduler × 2 个 LoRA rank/alpha/target_modules。
# 顺序执行；每个 config 由 config_recipe() 只覆盖 [train] / [peft] / execution.config_id。
[[configs]]
id = "lr5e-4-r8"
learning_rate = 5e-4
lr_scheduler_type = "linear"
warmup_steps = 0
lora_r = 8
lora_alpha = 16
lora_dropout = 0.1
target_modules = ["c_attn"]

[[configs]]
id = "lr5e-4-r32"
learning_rate = 5e-4
lr_scheduler_type = "linear"
warmup_steps = 0
lora_r = 32
lora_alpha = 64
lora_dropout = 0.1
target_modules = ["c_attn", "c_proj"]

[[configs]]
id = "lr2e-4-r8"
learning_rate = 2e-4
lr_scheduler_type = "cosine"
warmup_steps = 10
lora_r = 8
lora_alpha = 16
lora_dropout = 0.1
target_modules = ["c_attn"]

[[configs]]
id = "lr2e-4-r32"
learning_rate = 2e-4
lr_scheduler_type = "cosine"
warmup_steps = 10
lora_r = 32
lora_alpha = 64
lora_dropout = 0.1
target_modules = ["c_attn", "c_proj"]

[peft]
r = 8
alpha = 16
dropout = 0.1
target_modules = ["c_attn"]
bias = "none"
task_type = "CAUSAL_LM"

[repro]
level = "L0"
assessed_at = "2026-11-13"
assessed_by = "hand-audit + primary-source-check"
evidence_ref = "webfetch:rapidfire_sft_multiconfig_training"
evidence = ""
note = "编排层 recipe；评估集与训练集重叠导致 ROUGE-L 不构成泛化证据；本仓自建协议不宣称上游复现"

[repro.code]
state = "missing"
gap = "上游 14 篇均为 .ipynb；本仓库已提供统一 runner，但那是我们自建的执行层，不等于能重放上游 notebook 或 rapidfireai 服务"

[repro.env]
state = "missing"
gap = "%pip install rapidfireai 无版本；rapidfireai init/start 启动外部服务；无 lock 文件"

[repro.model]
state = "declared"
gap = "repo id gpt2 已按一手材料核实，但 from_pretrained 未传 revision"

[repro.data]
state = "declared"
gap = "repo id 与 26872 行/5 列已按数据卡核实，但 load_dataset 未传 revision"

[repro.params]
state = "declared"
gap = "4 组配置网格（lr × rank）、max_steps=64、batch/grad_accum/eval_steps/fp16 已按上游原文补齐；warmup/save_steps/seq_length 为本仓自建声明"

[repro.seed]
state = "declared"
gap = "shuffle(seed=42) + run_fit(seed=42)；无 set_seed、无 RFSFTConfig.seed、无 deterministic 策略"

[repro.eval]
state = "declared"
gap = "唯一有 compute_metrics（ROUGE-L）的一篇，但 eval_dataset=range(50,60) 完全落在 train_dataset=range(64) 内，且从未报告任何实际数值"

[repro.provenance]
state = "declared"
gap = "有上游 HTTPS URL，但 source_sha 为空，notebook 漂移无法定位"

[evaluation]
split = "rapidfire-sft-v1：规范化问题 hash 80/10/10 + 全局内容去重；test 为 shared held-out，最多300条；gold 不参与生成输入"
multi_run = true
held_out = true
seed = 42
max_new_tokens = 128
metrics = ["rouge_l", "exact_match"]

[budget]
smoke_steps = 5
full_steps = 64

[execution]
command = "python3 runner/train.py --recipe llm/sft/rapidfire-multiconfig --full --config-id lr5e-4-r8"
entrypoint = "../../../../runner/train.py"
lockfile = "../../../../runner/locks/llm__sft__rapidfire-multiconfig.lock.toml"
eval_script = "../../../../runner/eval.py"
zero_shot_script = "../../../../runner/zero_shot.py"
evidence = "evidence/run.json"
config_id = "lr5e-4-r8"
task_id = "rapidfire-sft-v1"
adapter_status = "implemented-unverified：五维代码（data/train/eval/comparison/export）均有隔离离线测试，task_router 精确注册 rapidfire-sft-v1；发布级为 4 配置 × 至少 3 独立训练 seed 的 validation 选配置 + test 单次验收 + 选中配置 adapter-only 离线复载；无 GPU 实跑、无 completed 证据、未冻结 revision、未预声明 export_tolerance、数据卡无 license，B1 不晋级"

# --- baseline contract (generated by scripts/apply_baseline_contract.py) ---
[baseline_contract]
state = "B1"
target_tier = "research"
experiment_id = "llm-sft-rapidfire-multiconfig-v1--lr5e-4-r8"
revision_policy = "runner/lock.py --apply@有网环境；锁定时写入 source_sha / model.revision / dataset.revision；本机无外网，当前刻意留空"
determinism = "torch.use_deterministic_algorithms(True); cudnn.deterministic=True; cudnn.benchmark=False; tf32=disabled; CUBLAS_WORKSPACE_CONFIG=:4096:8；数据划分由 data_seed 控制"
python_cuda = "python>=3.11,<3.14; torch CUDA build; CUDA 12.x（约束声明，实测版本由 runner/lock.py --apply 写入 lock 文件）"
single_variable = "所有可变超参集中在 [train] 与 [[configs]]；runner 内禁止硬编码；配置间只改 config 声明字段并保留 diff"
seed_origin = "seed 来自上游原文（42），data_seed / evaluation.seed 为本仓补充"

[resources]
gpu = "待实跑确认（gpt2 124M fp16 + LoRA，按 batch 与 max_steps 估）"
note = "B3 业务档需要实测卡时与显存；此处为预估值，不作为验收依据。数据卡未给 license，商业使用与再分发权限未确认"

[methodology]
registry = "registry/methodology.toml"
principles = ["datasheets_license_documentation", "lima_quality_over_quantity", "dedup_reduces_leakage"]

# --- reproducibility audit (generated by scripts/apply_repro_audit.py) ---
[train]
# 原文顶层常量 + TrainingArguments；上游用 transformers.Trainer，不是 SFTTrainer。
seed = 0
seed_mechanism = "set_seed(SEED) + shuffle(seed=SEED) + ConstantLengthDataset(seed=SEED)"
learning_rate = 5e-4
per_device_train_batch_size = 16
gradient_accumulation_steps = 1
max_steps = 2000
seq_length = 2048
lr_scheduler_type = "cosine"
weight_decay = 0.01
warmup_steps = 30
eval_steps = 100
bf16 = true
fim_rate = 0.5
fim_spm_rate = 0.5
lora_r = 8
lora_alpha = 32
lora_dropout = 0.0
held_out_examples = 4000
data_seed = 0
per_device_eval_batch_size = 16
save_steps = 100
logging_steps = 25
gradient_checkpointing = true
fp16 = false
optim = "adamw_torch"
dataloader_num_workers = 0
remove_unused_columns = false

# 自建受控协议，不是上游 ConstantLengthDataset 的字节复现。
[fim]
protocol = "repo-isolated-fim-v1"
source_split = "train"
data_dir = "data"
repo_column = "repo_id"
path_column = "file_path"
content_column = "content"
max_source_examples = 6000
split_percent = [80, 10, 10]
packing = "file-isolated"
loss = "causal-all-nonpadding"
eval_variant = "psm"
special_tokens = ["<fim_prefix>", "<fim_suffix>", "<fim_middle>"]

[peft]
r = 8
alpha = 32
dropout = 0.0
target_modules = ["c_proj", "c_attn", "q_attn", "c_fc"]
bias = "none"
task_type = "CAUSAL_LM"

[quantization]
load_in_4bit = true
quant_type = "nf4"
compute_dtype = "bfloat16"
double_quant = true


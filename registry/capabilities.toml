# 本地时点事实；不推断上游现状，不把配方登记或 dry-run 当成能力实现。
schema = 1
assessed_at = "2026-11-13"
expected_recipe_count = 14
dimensions = ["data", "train", "eval", "comparison", "export"]

[states]
missing = "任务逻辑未实现；配置、入口、TODO、dry-run 与 lock 模板均不算实现。"
implemented = "真实任务代码存在，并有 offline test 覆盖；仅核验仓内实现与测试文件，不代表 GPU 通过。"
unverified = "声称有实现或实跑，但实现/测试/运行证据不足；不能当作 implemented 或 verified。"
verified = "代码与 offline test 齐备，仓内真实 evidence JSON 的 stage=completed 且 kind 与维度相符；train/eval 还须 GPU 运行证据。"

[evidence_kinds]
data = "data"
train = "training"
eval = "evaluation"
comparison = "baseline-suite"
export = "export-reload"

[scope.cpt-dapt]
label = "CPT / DAPT 继续预训练与领域适应"
status = "backlog"
families = []
taxonomy = "not_registered"
why = "未纳入当前 taxonomy；需语料许可、文档去重、按来源隔离、长文本打包与 perplexity/领域任务回归，不能用现有 SFT 覆盖冒充。"
[scope.general-sft]
label = "通用文本 SFT"
status = "in_scope"
families = ["sft"]
why = "现有 xLAM/FIM 是专用任务；还需通用对话、assistant-only mask、packing、截断回归及指令跟随评估。"
[scope.text-preference]
label = "文本偏好优化"
status = "in_scope"
families = ["dpo", "mpo", "kto", "orpo", "cpo"]
why = "现有 DPO/MPO 配方都是 VLM，不代表文本偏好已覆盖；需共享 backbone/数据/预算与独立偏好评估。"
[scope.reward-modeling]
label = "RM 奖励建模"
status = "backlog"
families = ["reward-modeling"]
why = "family 已登记但无配方；需偏好对、标注质量、reward 校准、泛化与 reward hacking 检查。"
[scope.online-rl]
label = "online RL 与 agent RL"
status = "in_scope"
families = ["grpo", "rloo", "online-dpo", "gspo"]
why = "先验证数学可核验 reward，再支持 rollout 权重同步、环境生命周期和独立对局；现有 GRPO 登记不代表其余算法已实现。"
[scope.distillation]
label = "蒸馏"
status = "backlog"
families = ["distillation", "gkd"]
why = "family 已登记但无配方；需 teacher revision、采样与成本、生成数据追踪、student 对照和许可。"
[scope.image]
label = "多模态图片"
status = "in_scope"
families = ["sft", "dpo", "mpo", "grpo"]
why = "需 image/processor/collator 实装、视觉 token mask、图像级隔离及 ChartQA/grounding 污染检查。"
[scope.audio]
label = "多模态音频"
status = "backlog"
families = []
taxonomy = "not_registered"
why = "未纳入当前 taxonomy；需音频采样率、切片、说话人隔离、转写/语音任务指标，图片 VLM 不能代替。"
[scope.video]
label = "多模态视频"
status = "backlog"
families = []
taxonomy = "not_registered"
why = "未纳入当前 taxonomy；需帧采样、时间标注、视频级隔离与时序评估，静态图像流程不能代替。"
[scope.data]
label = "数据构建"
status = "in_scope"
families = []
why = "跨方法管线而非 trainer family；覆盖 schema、许可、gold 剥离、去重、冻结 manifest、合成数据溯源与 split 泄漏门禁。"
[scope.evaluation]
label = "eval 评估体系"
status = "in_scope"
families = []
why = "跨方法管线；需同协议 zero-shot、held-out、至少 3 个独立训练 seed 的方差/置信区间和失败样本。"
[scope.release]
label = "发布与业务交付"
status = "in_scope"
families = []
why = "跨方法管线；需打包、全新进程离线复载、指标回归、许可、成本/SLO、安全、owner、监控与回滚，不执行远端发布。"
[scope.legacy-ppo]
label = "经典 PPO 全栈"
status = "excluded"
families = ["ppo"]
why = "当前仓内 taxonomy 将 ppo 标为 removed；不扩张本轮主线，未来需求变化时须单独决定，不据此推断上游时点。"

[[waves]]
id = "wave0"
label = "fail-closed 门禁"
dependencies = []
prerequisites = "完整14篇登记、taxonomy 时点快照与代码/测试证据边界已核对。"
work = "严格校验 coverage、状态、impl/test 路径与 completed JSON；拒绝缺失 checkpoint 回退 base、假分数和 dry-run 晋级。"
acceptance = "负例单测通过；registered、implemented、GPU verified、research-ready、business-ready 分开计数；缺证据直接阻断晋级。"
[[waves]]
id = "wave1"
label = "数学端到端样板"
dependencies = ["wave0"]
prerequisites = "wave0 门禁验收；真实 model/dataset revision 与依赖锁定，确认 GPU 与预算。"
work = "复用 math_task.py：train[0:500]/val[500:1000]/test[1000:1500]、format/accuracy reward、math_verify、真实 train/eval/zero-shot；补多训练 seed 聚合及 export reload。"
acceptance = "offline test + 真实 zero-shot/smoke/full；至少 3 个独立 train seeds，各自 held-out 评估，aggregate 与全新进程复载通过后才称 research baseline。"
[[waves]]
id = "wave2"
label = "文本 SFT"
dependencies = ["wave0", "wave1"]
prerequisites = "wave1 的冻结/训练/评估/evidence 协议可复用且已验收。"
work = "通用 SFT backbone；xLAM schema masker、FIM 切段打包、RapidFire 无泄漏 4 配置顺序编排（不宣称复现上游并发调度）。"
acceptance = "gold 不进 prompt；assistant/FIM mask 与 token 对齐；源码/对话级 train/val/test 隔离；任务指标与同预算 3 seeds 对照、隔离代码执行评估。"
[[waves]]
id = "wave3"
label = "视觉 SFT"
dependencies = ["wave1", "wave2"]
prerequisites = "文本 collator/packing、独立评估与 export reload 已验收，视觉 processor revision 冻结。"
work = "两篇 ChartQA 因决策门/基座预训练污染判为原理性阻塞、不计入适配进度；Granite granite-linecomparison-v1 五维代码已齐备（图像内容 hash 三段隔离、显式 image_token_id + assistant-only 双层 mask、冻结 processor identity、held-out 逐题重算；granite_suite 三独立训练 seed 逐题内容重算与 Student-t95 聚合；granite_export 的 DoRA/4bit adapter-only 包与 HF offline 新进程复载），task_router 已精确注册，但全部只有 macOS ARM 离线合成证据、无 CUDA 实跑；PaliGemma bbox/loc round-trip/IoU 仍待实装。"
acceptance = "图像 token 不参与语言损失；bbox round-trip/IoU；图像级去重；ChartQA 污染声明与未污染外部集；每篇独立 held-out 指标及复载回归；Granite 五维须先冻结 revision 与可安装镜像、授权 Linux CUDA 三 seed 实跑、基于实跑预声明容差并完成许可与业务验收，发布级按 task_router 精确分派、不借用其他任务协议。"
[[waves]]
id = "wave4"
label = "DPO / MPO shared backbone"
dependencies = ["wave2", "wave3"]
prerequisites = "同一可用 SFT checkpoint、processor、偏好 split、reference 策略与预算冻结。"
work = "文本/VLM preference collator、chosen/rejected mask、DoRA 与 frozen ref model；MPO sigmoid/bco_pair/sft 三损失装配与消融。"
acceptance = "DPO vs MPO 必须 shared backbone，现有不同模型的两篇不能直接归因算法；beta/loss/权重显式配置，3 seeds 配对对照、ref 无梯度且复载等价。"
[[waves]]
id = "wave5"
label = "vLLM / agent RL"
dependencies = ["wave1", "wave3", "wave4"]
prerequisites = "数学 reward 与视觉输入协议通过；多 seed 聚合、权重/checkpoint 身份追踪可用。"
work = "同配置切换 use_vllm，验证 rollout 权重同步；Wordle 环境、会话回收与按词/对局隔离；VLM GRPO 单数 image 与预渲染 prompt。"
acceptance = "vLLM on/off 除开关外同配置、记录同步步数与吞吐/显存/质量；异常/超时无会话泄漏；独立对局 solve-rate，VLM reward 失败关闭。"
[[waves]]
id = "wave6"
label = "方法与模态扩展"
dependencies = ["wave1", "wave2", "wave3", "wave4", "wave5"]
prerequisites = "前序 shared backbone、数据冻结、聚合、复载协议全部验收；范围与许可单独审批。"
work = "补 GSM8K 四 reward/完整超参/gold 剥离；按自动 family 缺口推进 KTO/RM/RLOO/online-DPO/GSPO/蒸馏/ORPO/CPO/GKD/prompt-tuning；CPT/DAPT、音视频另立模块。"
acceptance = "每种方法有独立配方、offline tests、真实完成 evidence、3 seeds 对照与交付回归；未纳入 taxonomy 的模块先定契约，禁止用登记数宣称全生态覆盖。"


# 逐篇「能否作为 research / business training baseline」的原理性判定。
#
# 与 capabilities.toml / baseline.toml 的分工：
#   - capabilities.toml 记录代码实装与离线测试（能不能跑起来）；
#   - baseline.toml / baseline_evidence.py 记录证据与就绪度（有没有真实跑过、证据够不够）；
#   - 本文件记录**原理上是否值得作为 baseline**（实验目标、数据污染、决策门）。
# 三者不能互相替代：字段齐备 + 五维代码 + GPU 实跑证据，仍可能因为本文件判定为
# blocked_zero_train / contaminated_pretraining 而永远不该被当作泛化 baseline。
#
# verdict 只允许 criteria 中的枚举；blockers / requires 不允许为空。
# 任何改动都必须引用一手材料，不得为了让计数好看而改判定。
# 2026-11-15 第一次重新判定：Granite 篇实装 data/train/eval 三维后由
# not_implemented 改为 partial_implementation（ADR-021）。
# 2026-11-15 第二次重新判定：Granite 篇补齐 comparison/export 并精确注册
# task_router 后由 partial_implementation 改为 pending_freeze（ADR-022）——
# 五维代码齐备不等于 eligible；冻结输入/环境、CUDA 三 seed 实跑、预声明容差、
# 导出复载与许可确认仍全未完成。两篇 ChartQA 的原理性阻塞与 eligible 0/14 不变。
# 2026-11-16 第三次重新判定：PaliGemma2 grounding 篇补齐五维并精确注册
# task_router 后由 not_implemented 改为 pending_freeze（ADR-023）——
# 自建单框 <loc####>/IoU 协议只有 macOS ARM 隔离合成证据；gated 基座、
# RefCOCO/COCO/Flickr 图像许可、冻结 revision、CUDA 三 seed 与业务验收全未完成。
# 六篇五维齐备仍 eligible 0/14；两篇 ChartQA 原理性阻塞不变。
# 2026-11-18 第四次重新判定：DPO / MPO 两篇补齐五维并精确注册 task_router 后
# 由 not_implemented 改为 pending_freeze（ADR-027）——自建偏好协议只有
# macOS ARM 隔离合成证据；两篇基座不同，不得跨 backbone 归因算法；
# revision / CUDA 三 seed / 容差 / 许可全未完成。eligible 0/14 与 ChartQA 阻塞不变。

schema = 1
assessed_at = "2026-11-18"
expected_recipe_count = 14
title = "Baseline 可行性判定"

[criteria]
eligible = "实验目标、数据与评估协议成立；补齐代码/冻结/实跑/许可后可直接进入 B2 证据门禁。当前 0 篇。"
blocked_zero_train = "一手材料自承零训练基线即可达标（decision.gate=blocked）；微调不改变业务结论，投入训练预算不成立。即使补齐代码与 GPU 证据也不晋级，除非先改写实验目标并重新判定。"
contaminated_pretraining = "基座已在评估数据集上训练过，held-out 不构成泛化验证；作者自承只是 educational exercise。必须换未被污染的外部集并重做判定，否则不得用于泛化结论。"
not_implemented = "任务逻辑完全缺失；既没有可复现的训练/评估实现，也没有可核查的对照协议。"
partial_implementation = "data/train/eval 三维已有自建协议、真实任务代码与隔离离线测试，但 comparison/export 两维未实装、发布级路由未注册；仍无冻结输入/环境、CUDA 多 seed 实跑与预声明容差，不能算 eligible 或 pending_freeze。"
pending_freeze = "原理上可作为 baseline 且五维代码已实装，但冻结输入/环境、CUDA 多 seed 实跑、预声明容差、导出复载与许可确认全未完成；GPU verified 0。"

[verdict_policy]
promotion_blocking = ["blocked_zero_train", "contaminated_pretraining", "not_implemented", "partial_implementation", "pending_freeze"]
needs_override = ["blocked_zero_train", "contaminated_pretraining"]
override_rule = "blocked_zero_train / contaminated_pretraining 只能通过显式改写实验目标、换数据集、重新核一手材料并重新判定来解除；不接受新增 evidence JSON 或抬高 B 状态绕过。"


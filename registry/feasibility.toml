blockers = ["无轨迹 schema 与答案词/对局级 train/val/test 划分", "无 rollout/reward/trainer 桥接与超时异常处理", "无独立对局评估与 multi-seed 聚合"]
requires = ["实现环境与按对局隔离的冻结数据协议", "实现 rollout、reward 与异常回收", "三独立训练 seed 的同词表 held-out 对照与复载"]

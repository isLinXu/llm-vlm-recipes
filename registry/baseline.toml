# 状态代表不同事实，不是越填字段越接近实跑。证据检查只能证明内部一致性，不能替代GPU复核。
schema = 2
assessed_at = "2026-11-13"
states = ["B0", "B1", "B2", "B3"]
tiers = ["research", "business"]

[states_meta.B0]
label = "not-ready"
description = "执行契约未齐"
[states_meta.B1]
label = "declared"
description = "仅声明：命令、入口、环境锁模板与种子存在；不代表任务适配已实现、划分可执行或GPU跑通"
[states_meta.B2]
label = "research-ready"
description = "输入和运行环境冻结，基座实测及至少3个独立训练seed的同协议对照可核查；指标在容差内，仍需人工真实性复核"
[states_meta.B3]
label = "business-ready"
description = "B2之上，许可确认、实测资源、业务验收、交接与导出重载回滚复核齐全"
[groups.G1]
label = "可引用"
why = "实验、权重、数据与许可可追溯"
[groups.G2]
label = "可重放"
why = "输入、代码与完整执行环境固定"
[groups.G3]
label = "可对照"
why = "基座与训练模型同样本同协议，独立训练seed统计"
[groups.G4]
label = "可交付"
why = "资源实测、业务验收、导出复载与回滚"

[[checks]]
id = "C101"
group = "G1"
min_state = "B1"
label = "实验标识"
field = "baseline_contract.experiment_id"
kind = "field"
why = "引用需要稳定实验代号"
how = "声明实验ID"
[[checks]]
id = "C102"
group = "G1"
min_state = "B1"
label = "revision策略"
field = "baseline_contract.revision_policy"
kind = "field"
why = "声明如何冻结输入"
how = "说明锁定流程"
[[checks]]
id = "C103"
group = "G1"
min_state = "B3"
label = "模型许可确认"
field = "baseline_contract.license_model"
kind = "confirmed"
confirmation_field = "baseline_contract.license_model_confirmed"
why = "unknown不等于商用授权"
how = "填写许可和核查确认"
[[checks]]
id = "C104"
group = "G1"
min_state = "B3"
label = "数据许可确认"
field = "baseline_contract.license_data"
kind = "confirmed"
confirmation_field = "baseline_contract.license_data_confirmed"
why = "数据和权重许可分别核查"
how = "填写数据许可和核查确认"
[[checks]]
id = "C201"
group = "G2"
min_state = "B2"
label = "来源commit"
field = "source_sha"
kind = "commit"
why = "main与占位字符串不是冻结版本"
how = "使用查询所得40位commit，真实性需复核"
[[checks]]
id = "C202"
group = "G2"
min_state = "B2"
label = "模型revision"
field = "model.revision"
kind = "commit"
why = "锁到明确模型版本"
how = "runner/lock.py --apply"
[[checks]]
id = "C203"
group = "G2"
min_state = "B2"
label = "数据或在线环境revision"
field = "dataset.revision"
kind = "dataset_pin"
why = "在线Wordle无Hub dataset，应冻结环境、词表及生成种子"
how = "静态数据锁dataset.revision；在线数据锁environment.revision/corpus_sha256/seed"
[[checks]]
id = "C204"
group = "G2"
min_state = "B1"
label = "执行命令"
field = "execution.command"
kind = "field"
why = "统一入口不等于任务已经实现"
how = "声明训练命令"
[[checks]]
id = "C205"
group = "G2"
min_state = "B1"
label = "入口文件"
field = "execution.entrypoint"
kind = "file"
why = "入口必须存在"
how = "recipe目录相对路径"
[[checks]]
id = "C206"
group = "G2"
min_state = "B1"
label = "锁模板文件"
field = "execution.lockfile"
kind = "file"
why = "模板只是冻结计划，不能替代实际完整依赖锁"
how = "提供环境模板；C212验证冻结结果"
[[checks]]
id = "C207"
group = "G2"
min_state = "B1"
label = "训练seed"
field = "train.seed"
kind = "integer"
why = "0是合法seed，bool与文本不是"
how = "非负整数"
[[checks]]
id = "C208"
group = "G2"
min_state = "B1"
label = "数据seed"
field = "train.data_seed"
kind = "integer"
why = "数据划分独立控制"
how = "非负整数"
[[checks]]
id = "C209"
group = "G2"
min_state = "B1"
label = "确定性策略"
field = "baseline_contract.determinism"
kind = "field"
why = "声明策略，实跑记录实际生效值"
how = "显式声明determinism"
[[checks]]
id = "C210"
group = "G2"
min_state = "B1"
label = "运行时约束"
field = "baseline_contract.python_cuda"
kind = "field"
why = "目标约束不等于实测环境"
how = "声明目标，C212核查实际版本"
[[checks]]
id = "C211"
group = "G2"
min_state = "B1"
label = "对照变量原则"
field = "baseline_contract.single_variable"
kind = "field"
why = "记录数据、算法、资源等各变量的受控diff，而非只允许改train"
how = "声明对照原则"
[[checks]]
id = "C212"
group = "G2"
min_state = "B2"
label = "完整冻结环境"
field = "execution.lockfile"
kind = "frozen_environment"
why = "只有若干版本注释和空pip_freeze不可重放"
how = "冻结完整requirements、Python、CUDA、驱动、GPU并校验输入revision"
[[checks]]
id = "C301"
group = "G3"
min_state = "B1"
label = "评估入口"
field = "execution.eval_script"
kind = "file"
why = "存在不等于实现"
how = "声明评估入口"
[[checks]]
id = "C302"
group = "G3"
min_state = "B1"
label = "数据划分声明"
field = "evaluation.split"
kind = "field"
why = "B1仅记录划分意图，B2要求实际manifest"
how = "说明划分协议"
[[checks]]
id = "C303"
group = "G3"
min_state = "B1"
label = "独立训练多seed计划"
field = "evaluation.multi_run"
kind = "equals"
expect = true
why = "计划多轮不等于已做多轮，greedy重复不能当训练方差"
how = "声明独立训练seed计划"
[[checks]]
id = "C304"
group = "G3"
min_state = "B2"
label = "实测指标数值表"
field = "evaluation.expected"
kind = "numbers"
why = "待实跑等文本和NaN不构成指标"
how = "覆盖全部metrics的有限数值表"
[[checks]]
id = "C305"
group = "G3"
min_state = "B2"
label = "容差数值表"
field = "evaluation.tolerance"
kind = "numbers"
why = "验收需要明确非负绝对容差"
how = "覆盖全部metrics的非负有限数值表"
[[checks]]
id = "C306"
group = "G3"
min_state = "B2"
label = "基座实际评估"
field = "baseline.measurement"
kind = "zero_train_measurement"
why = "上游一句passes不等于本仓库实测"
how = "真实evaluation JSON及预测文件hash，不以文字结果代替"
[[checks]]
id = "C307"
group = "G3"
min_state = "B2"
label = "独立训练对照证据集合"
field = "execution.evidence"
kind = "baseline_suite"
why = "单次日志、模拟指标、重复greedy评估不证明研究基线"
how = "baseline-suite v1：至少3个训练seed、配对评估、配置/代码/划分/锁及产物hash，重算均值验收"
[[checks]]
id = "C401"
group = "G4"
min_state = "B3"
label = "资源实测复核"
field = "resources"
kind = "confirmed"
confirmation_field = "resources.measured"
why = "预估A100卡时不是业务成本证据"
how = "实跑记录GPU/显存/卡时，人工复核measured"
[[checks]]
id = "C402"
group = "G4"
min_state = "B3"
label = "smoke/full成本档"
field = "budget"
kind = "field"
why = "成本闸门实际由runner执行并测预算失败路径"
how = "设smoke/full预算并执行测试"
[[checks]]
id = "C403"
group = "G4"
min_state = "B3"
label = "业务验收复核"
field = "baseline_contract.acceptance"
kind = "confirmed"
confirmation_field = "baseline_contract.acceptance_verified"
why = "声明业务门槛不等于业务验证通过"
how = "核查任务效果、安全失败路径、成本及回退，留下验收记录"
[[checks]]
id = "C404"
group = "G4"
min_state = "B3"
label = "维护归属"
field = "baseline_contract.owner"
kind = "field"
why = "漂移和回滚需要责任团队"
how = "登记团队或角色"
[[checks]]
id = "C405"
group = "G4"
min_state = "B3"
label = "导出重载回滚复核"
field = "baseline_contract.export_evidence"
kind = "export_reload"
confirmation_field = "baseline_contract.export_verified"
why = "人工布尔值不能代替导出包/新进程复载的内容验证；回滚演练仍单独人工复核"
how = "数学export.json须通过模型/文件/锁/复载/当前容差重算；另填rollback_evidence与rollback_verified=true，非数学任务未适配则拒绝"

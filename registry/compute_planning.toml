# ───────────────────────── 多卡并行策略与硬件起点速查（估算，非实测） ─────────────────────────
[[parallel_strategy]]
id = "ddp"
name = "DDP（纯数据并行）"
applicable = "单卡放得下完整模型 + 优化器（如 7B QLoRA 多卡扩吞吐）"
memory_effect = "不切分权重与优化器；单卡显存几乎不降，靠减小 per-card grad_accum 换吞吐"
batch_rule = "保持 micro_batch × grad_accum × 卡数 = 目标有效 batch"
estimate = true

[[parallel_strategy]]
id = "zero2_fsdp_shard_grad"
name = "DeepSpeed ZeRO-2 / FSDP SHARD_GRAD_OP"
applicable = "3B–14B LoRA/全参：梯度与优化器显存成为瓶颈，但单卡能放下权重"
memory_effect = "优化器与梯度按卡数均分，通信开销显著低于 ZeRO-3"
batch_rule = "同步下调 grad_accum；保持有效 batch 与学习率不变"
estimate = true

[[parallel_strategy]]
id = "zero3_fsdp_full"
name = "DeepSpeed ZeRO-3 / FSDP FULL_SHARD"
applicable = "14B–70B 全参或 70B bf16 LoRA（单卡权重+状态已超 80GB）"
memory_effect = "权重 / 梯度 / 优化器全分片；下限 = ceil(推荐显存÷80GB)，建议 +1 卡留通信与 AllGather 峰值余量"
batch_rule = "尽量维持 micro_batch ≥ 1 并开启 gradient_checkpointing + bf16"
estimate = true

[[parallel_strategy]]
id = "grpo_colocate"
name = "GRPO + vLLM colocate"
applicable = "单卡或小规模（≤3B–7B QLoRA），生成与训练分时复用同一 GPU"
memory_effect = "必须给 vLLM 留出 gpu_memory_utilization（如 0.3）；长 completion 吞吐提升 +75%–+100%"
batch_rule = "micro_batch 必须整除 num_generations；每步 prompt 数 = 有效 batch ÷ num_generations"
estimate = true

[[parallel_strategy]]
id = "grpo_server"
name = "GRPO + vLLM server（trl vllm-serve）"
applicable = "多卡 / 7B–70B 在线 RL，生成 GPU 与训练 GPU 物理隔离"
memory_effect = "独立推理卡满载 KV cache，训练卡不再被 vLLM 占显存，减少生成/训练切换空闲"
batch_rule = "注意 vllm_importance_sampling_cap 等异步/策略偏移保护；先单卡 smoke 验证 reward 再切多卡"
estimate = true


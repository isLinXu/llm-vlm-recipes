[[paper_anchor]]
paper_id = "rlaif_v"
arxiv_id = "2405.17220"
topic = "AI 反馈偏好规模"
planning_role = "开源 MLLM 反馈可用于偏好构建；但跨基座（SmolVLM vs Qwen2.5-VL）不能把指标差归因到算法"

[[paper_anchor]]
paper_id = "deepseekmath_grpo"
arxiv_id = "2402.03300"
topic = "GRPO 无 critic 内存"
planning_role = "去掉 PPO value/critic 省下显存；实际瓶劲转移到每步 num_generations 次在线自回归生成"

[[paper_anchor]]
paper_id = "vllm_pagedattention"
arxiv_id = "2309.06180"
topic = "KV 显存与 rollout 引擎"
planning_role = "PagedAttention 提升长生成吞吐；colocate 下须从训练显存划拨 gpu_memory_utilization"

[[paper_anchor]]
paper_id = "qwen2vl"
arxiv_id = "2409.12191"
topic = "动态分辨率视觉 token"
planning_role = "VLM 图像 token 数随分辨率变化，SFT/DPO 须设 max_length=None，大图会显著推高激活显存"

[[paper_anchor]]
paper_id = "qwen25vl"
arxiv_id = "2502.13923"
topic = "原生空间分辨率感知"
planning_role = "同上：视觉推理 max_prompt_length 需给足 2048 防止截断视觉 token，显存估算不能只看文本长度"

# ───────────────────────── 利用率区间（估算，非实测） ─────────────────────────
[[utilization_band]]
id = "sft_qlora_lora"
scenario = "SFT / LoRA / QLoRA，micro-batch 填满显存"
gpu_util_pct = "60–90"
vram_util_pct = "70–95"
bottleneck = "算力 / 数据加载"
estimate = true

[[utilization_band]]
id = "dpo_mpo"
scenario = "DPO / MPO（policy + ref 前向）"
gpu_util_pct = "55–85"
vram_util_pct = "65–90"
bottleneck = "算力；长序列 / 图像 token 受显存限制"
estimate = true

[[utilization_band]]
id = "grpo_hf_generate"
scenario = "GRPO，HF generate 在线采样"
gpu_util_pct = "30–60"
vram_util_pct = "50–85"
bottleneck = "rollout 生成（自回归解码）"
estimate = true

[[utilization_band]]
id = "grpo_vllm_colocate"
scenario = "GRPO，vLLM colocate"
gpu_util_pct = "45–75"
vram_util_pct = "70–90"
bottleneck = "生成 / 训练切换；gpu_memory_utilization 需与训练争显存"
estimate = true


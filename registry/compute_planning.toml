# 垂类后训练算力 / 数据规模规划登记（事实源，手写；docs/COMPUTE-PLANNING.md 为人类可读表）
#
# 诚信边界（与 AGENTS.md 一致）：
# - 本文件只做「规划」，不是 GPU 实跑证据；GPU verified 0、B2+/B3 0、L2+ 0、eligible 0/14 不变。
# - 实测锚点（[[anchor]] / [[vllm_colocate_row]]）只收录上游 recipe/论文自带数字；其余数值均为工程估算（estimate=true）。
# - 任何论文 / 配方都没有给出「GPU 利用率 %」；[[utilization_band]] 全部是估算区间，必须用 5 步 smoke 实测校准。
# - 不得用本文件的估算当作 B3 业务档验收依据。

[meta]
schema = "compute-planning/v1"
estimates_are_not_evidence = true
gpu_verified = 0
min_independent_seeds_for_release = 3
seed_budget_note = "发布级对比要求 ≥3 个独立训练 seed（Student-t95）；多配置套件（RapidFire 4×3+1=13 次、MPO 3×3+1=10 次、GSM8K 5×3+1=16 次）总算力约为单次的 10–16 倍。"
grpo_batch_semantics = "本仓 GRPO 校验 per_device_train_batch_size % num_generations == 0，即 batch 按 completions 计数；每 optimizer step 的 prompt 数 = micro_batch × grad_accum ÷ num_generations。TRL 不同版本语义不同，换版本须复核。"

# ───────────────────────── 显存估算规则（仅权重 + 优化器状态，GB） ─────────────────────────
# weights_gb = coef_per_b × 参数量(B) + const_gb；推荐显存 = weights_gb × headroom（覆盖激活 / KV / 碎片）。
# 全部是估算：不含 vLLM 引擎显存；长序列、大 micro-batch、VLM 图像 token 会显著突破 headroom。
[memory]
headroom = 1.4
single_card_tiers_gb = [24, 40, 48, 80]
multi_card_assume_gb = 80
multi_card_note = "多卡下限 = ceil(推荐显存 ÷ 80)，假设 ZeRO-3 / FSDP 均分状态，不含通信缓冲与不均衡；实际需 +1 卡余量并用 smoke 复核。"
estimate = true

[[memory_rule]]
id = "qlora_sft"
label = "QLoRA SFT（4bit 底座 + LoRA/DoRA）"
coef_per_b = 0.65
const_gb = 0.8
anchor = "QLoRA 论文（2305.14314）：65B 单卡 48GB 可微调（0.65×65+0.8≈43GB 权重，余量给激活）"

[[memory_rule]]
id = "lora_bf16"
label = "LoRA SFT（bf16/fp16 2-byte 底座）"
coef_per_b = 2.0
const_gb = 1.0
anchor = ""

[[memory_rule]]
id = "full_sft"
label = "全参 SFT（bf16 + AdamW fp32 状态）"
coef_per_b = 16.0
const_gb = 0.0
anchor = "2P 权重 + 2P 梯度 + 12P 优化器（含 fp32 master / m / v）"

[[memory_rule]]
id = "dpo_qlora"
label = "DPO / MPO（QLoRA，policy + 冻结 ref）"
coef_per_b = 1.3
const_gb = 0.8
anchor = ""

[[memory_rule]]
id = "grpo_lora"
label = "GRPO（LoRA，bf16；不含 rollout 引擎）"
coef_per_b = 2.0
const_gb = 1.0
anchor = ""

[[memory_rule]]
id = "grpo_full"
label = "GRPO（全参，bf16 + AdamW）"
coef_per_b = 18.0
const_gb = 0.0
anchor = "全参 SFT 16P + 冻结参考模型 2P（对应 Qwen2.5-3B GSM8K 全参 GRPO 声明 1× A100 80GB）"

[[matrix_model]]
id = "0.5B"
params_b = 0.5

[[matrix_model]]
id = "1.7B"
params_b = 1.7

[[matrix_model]]
id = "3B"
params_b = 3.0

[[matrix_model]]
id = "7B"
params_b = 7.0

[[matrix_model]]
id = "8B"
params_b = 8.0

[[matrix_model]]
id = "14B"
params_b = 14.0

[[matrix_model]]
id = "32B"
params_b = 32.0

[[matrix_model]]
id = "70B"
params_b = 70.0

# ───────────────────────── 数据规模阶梯（启发式） ─────────────────────────
[[tier]]
id = "step0_smoke"
name = "S0 冒烟"
purpose = "只验证管线可跑、日志 / checkpoint / 导出链路通；不看指标"
sft_samples = "8–32"
preference_pairs = "8–32"
rl_prompts = "8–32"
seeds = 1
steps_hint = "5 步（仓库 smoke_steps=5）"
anchors = ["仓库 budget.smoke_steps = 5", "Wordle smoke_n_prompts = 30"]
heuristic = true

[[tier]]
id = "step1_pilot"
name = "S1 试点"
purpose = "看 loss / reward 是否下降，吞吐校准（得到 s/步、s/rollout）"
sft_samples = "100–1k"
preference_pairs = "500–2k"
rl_prompts = "200–1k"
seeds = 1
steps_hint = "30–150 步"
anchors = ["LIMA 1k 样本对齐（arXiv 2305.11206）", "Wordle 校准 40 rollouts / 92.4 s → 2.31 s/rollout"]
heuristic = true

[[tier]]
id = "step2_minimum_viable"
name = "S2 最小可用"
purpose = "垂类行为稳定出现；做去重 / 留出集 / 污染检查后再看指标"
sft_samples = "1k–10k"
preference_pairs = "2k–10k"
rl_prompts = "1k–3k"
seeds = "1–2"
steps_hint = "150–500 步"
anchors = ["仓库 GRPO full_steps=150 × 8–16 prompts/step ≈ 1.2k–2.4k prompts", "Wordle full_n_prompts = 3000", "去重 arXiv 2107.06499"]
heuristic = true

[[tier]]
id = "step3_baseline"
name = "S3 基线级"
purpose = "可对外比较：≥3 独立 seed、Student-t95、零训练基线对照"
sft_samples = "10k–50k"
preference_pairs = "10k–50k"
rl_prompts = "3k–10k"
seeds = "≥3"
steps_hint = "500–2000 步 × 3 seed"
anchors = ["仓库发布门禁：≥3 独立训练 seed", "欠指定 arXiv 2011.03395", "奖励过优化 arXiv 2210.10760"]
heuristic = true

[[tier]]
id = "step4_scale"
name = "S4 放大"
purpose = "覆盖长尾与分布外；需要数据治理、版本冻结与持续评测"
sft_samples = "50k–500k+"
preference_pairs = "50k+"
rl_prompts = "10k+"
seeds = "≥3"
steps_hint = "2000+ 步，常需多卡"
anchors = ["无统一论文阈值；以 S3 的留出集收益曲线是否仍上升决定是否放大"]
heuristic = true

# ───────────────────────── P0–P3 垂类实验决策门（来自 Cookbook 调研第 09 章 + R302） ─────────────────────────
[[stage_gate]]
id = "P0"
name = "零训练基线"
action = "固定 held-out 与定量指标，先跑 prompting / RAG / 结构化生成 / 更大基座"
exit_gate = "若 P0 已达标（如 ChartQA 零训练即过），按 R302 终止微调，不烧训练算力"

[[stage_gate]]
id = "P1"
name = "最小 SFT"
action = "1B–3B 小模型 + 约 10% 数据（S1–S2 量级），QLoRA r=8，1 epoch，确认数据契约与 completion-only mask"
exit_gate = "相对 P0 有可测净增量且无泄漏；缺格式/领域知识时优先补数据清洗而非加卡"

[[stage_gate]]
id = "P2"
name = "规模化 SFT / 偏好"
action = "全量数据（S3）、更大基座（7B–32B）、顺序/并发超参网格、≥3 seed 与 Student-t95"
exit_gate = "画出成本/收益曲线；有 chosen/rejected 偏好且 SFT 偏移时再进 DPO/MPO"

[[stage_gate]]
id = "P3"
name = "可验证 RL（可选）"
action = "先写 reward 失败路径单测，单卡 smoke 校准 rollout 吞吐与 vLLM colocate，再扩至 server/多卡"
exit_gate = "监控 reward 曲线与独立 verifier 指标（如 reward_hacking_rate）；两者背离立即停止"


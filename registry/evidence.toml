sources = ["https://huggingface.co/learn/cookbook/rapidfire_sft_multiconfig_training", "https://huggingface.co/datasets/bitext/Bitext-customer-support-llm-chatbot-training-dataset"]
primary_facts = "Cookbook用gpt2 + bitext/Bitext-customer-support-llm-chatbot-training-dataset；train_dataset=dataset['train'].select(range(64))、eval_dataset=select(range(50,60))（eval ⊂ train，数据泄漏）；train/eval均shuffle(seed=42)；sample_formatting_function生成'Question: {instruction}\\nAnswer: {response}'整段text；sample_compute_metrics把eval_preds的predictions/labels直接传给evaluate.load('rouge')且use_stemmer=True，异常静默返回{}，页面从未报告任何rougeL/loss数值。4组配置=2个lr/scheduler（5e-4/linear、2e-4/cosine+warmup_steps=10）×2个LoRA（r8/alpha16/c_attn、r32/alpha64/c_attn+c_proj，dropout=0.1/bias=none）；max_steps=64、batch=2、grad_accum=2、eval_steps=4、logging_steps=2、fp16、gradient_checkpointing、report_to=none；RapidFire AI调用Experiment/RFGridSearch/RFModelConfig/RFLoraConfig/RFSFTConfig/List，experiment.run_fit(..., num_chunks=4, seed=42)，另有rapidfireai init/start本地服务与InteractiveController。无model/dataset revision、无包版本（%pip install rapidfireai）、无set_seed/RFSFTConfig.seed/deterministic；页面只有16-24×吞吐宣传，不是训练指标。数据卡：26872条问答对，仅train split，5列flags/instruction/category/intent/response，27 intents；未给license（仅(c) Bitext Innovations, 2024），未给revision，语言为英文但未显式声明language元数据；category查看器显示11 values而卡片正文写10 categories，intent映射只列出20个。"
local_deviations = "本仓rapidfire-sft-v1自建：按规范化问题hash(NFKC+casefold+空白折叠)做80/10/10三段不重叠划分，同题所有生成变体落同一split，全局拒绝规范化内容重复；prompt只到'Answer:'，Trainer+completion-only collator只对' {response}'+EOS计loss；评估为单样本greedy、首个EOS截断，纯Python无stemmer LCS ROUGE-L与exact_match，不引入未冻结版本的evaluate/rouge_score；4配置由[[configs]]精确声明并顺序执行，config_recipe只覆盖train/peft/config_id/experiment_id以隔离输出与证据；TrainingArguments/Trainer/PeftModel/LoraConfig/api参数显式核验，safetensors张量严格复载，fingerprint绑定rapidfire协议段/完整网格/config_id；训练右padding、eager/no remote code/no Hub push；full=64/smoke=5。"
release_deviations = "发布级按ADR-019补齐：validation/test评估split分离并绑定eval_stage；rapidfire_suite.py做4配置×3互异独立训练seed严格聚合，逐题从eval_manifest的raw instruction/response重建prompt与gold并重算无stemmer ROUGE-L/exact_match，只用validation的paired均值选配置（平局按config_id字典序）、test只在选中配置上验收一次，输出均值/样本方差/SEM/Student-t95与顺序执行时长/显存/步数成本；rapidfire_export.py导出选中配置adapter-only包，HF offline新进程真实调用rapidfire_task.run_evaluation在test复评；task_router精确注册rapidfire-sft-v1的suite/export，C306/C307/C405分派到专用校验器，未知或冲突任务仍失败关闭。_identity_recipe剥离实跑后回填的expected/tolerance/execution.evidence，保留训练前预声明的export_tolerance，避免注册C307时与训练时effective_recipe.json内容身份失配；acceptance是阈值判定而非证据重算内容，验收由suite_problems用当前阈值独立判定，绝不采信JSON里自称的passed。"
limits = "自建ROUGE-L与上游use_stemmer=True数值不可比，且上游从未报告任何数值；顺序执行不宣称复现rapidfireai并发调度或16-24×加速，成本对照明确upstream_throughput_comparable=false。真实model/dataset/source revision、完整CUDA环境锁、数据许可（卡片未给license）、商业使用与再分发权限全未确认；只有隔离tmp_path合成fake runtime证据，无GPU实跑、无真实completed证据、无真实三独立训练seed、无真实导出复载、无并发吞吐消融；真实recipe未预声明evaluation.export_tolerance，--full导出失败关闭，不回填容差，B1不晋级。ROUGE-L/exact_match只是文本格式指标，不证明客服业务正确或安全。"

# ---------------------------------------------------------------- 跨篇共性发现

[[findings]]
id = "F01"
severity = "blocker"
summary = "依赖安装不可重放"
evidence = '多篇为 !pip install -U -q git+https://github.com/huggingface/trl.git ...（无 commit、带 -U）；其余为 !pip install -U trl ... 或 %pip install rapidfireai（无任何版本约束）。唯一写进安装命令的精确 pin 是 MPO 篇的 qwen-vl-utils==0.0.8'
consequence = "注释里的 # Tested with trl==0.14.0 只是作者当时的环境快照，不是可执行的安装指令；任何人重跑都会拿到不同的 trl"

[[findings]]
id = "F02"
severity = "blocker"
summary = "14 篇模型与数据集均无 revision 锁定"
evidence = "全部 14 篇的 from_pretrained / load_dataset 调用均无 revision；上游页面同样标注「未提及」。唯一出现的 commit hash 是 code LLM 篇注释里的 Megatron-LM 参考链接，不是模型或数据集 revision"
consequence = "Hub 权重或数据集更新会静默改变结果，且无法回溯到当时的版本"

[[findings]]
id = "F03"
severity = "blocker"
summary = "训练侧普遍无随机种子，但存在两个例外"
evidence = "12 篇训练 config 无 seed / data_seed / deterministic。例外：code LLM 篇 SEED = 0 + set_seed(SEED) + shuffle(seed=SEED) + ConstantLengthDataset(seed=SEED)；RapidFire 篇 run_fit(..., seed=42) + train/eval_dataset.shuffle(seed=42)"
consequence = "切分可复现但训练不可复现；配置里写 evaluation.seed=42 属于我们补的协议，不是上游已有事实。两篇例外也没有 deterministic / cudnn / tf32 策略与 TrainingArguments.seed，仍达不到 pinned"

[[findings]]
id = "F04"
severity = "major"
summary = "上游无执行入口"
evidence = "14 篇均为 .ipynb / Colab notebook，依赖内核状态；GitHub 更新链接全部指向 notebooks/en/*.md，而非 .py 脚本"
consequence = "即使参数齐全也无法一条命令重跑"

[[findings]]
id = "F05"
severity = "major"
summary = "评估普遍缺失，且「有 compute_metrics」不等于「评估有效」"
evidence = "仅 RapidFire 篇有 sample_compute_metrics（ROUGE-L）；其余 13 篇无 compute_metrics / trainer.evaluate。advanced reward 篇仅有单题 expected_answer='72' 的格式检查；Wordle 篇是唯一有 solve rate / mean reward / reward delta 统计的一篇"
consequence = "无法判定训练是否真的带来增益"

[[findings]]
id = "F06"
severity = "major"
summary = "reward 失败路径存在设计缺陷"
evidence = '基础 GRPO 篇 accuracy_reward：if len(gold_parsed) != 0: ... except: 0.0 ; else: rewards.append(1.0) —— gold 答案解析失败时直接给满分'
consequence = "数据质量问题会被当成模型答对，reward 曲线虚高；原配置写成「解析失败返回 None」与原文相反"

[[findings]]
id = "F07"
severity = "major"
summary = "VLM 图像列与 prompt 结构与我们的契约假设不同"
evidence = 'VLM GRPO 篇 make_conversation 返回 {"prompt": <apply_chat_template 后的字符串>, "image": example["image"]}；顶层图像列是单数 image'
consequence = "原配置写 images（复数）+ conversational 结构与上游不符；同时说明 R105 / R108 对 prompt-only VLM 过严，需在规范中注明例外"

[[findings]]
id = "F08"
severity = "note"
summary = "版本注释 ≠ 版本约束"
evidence = 'vLLM 篇：# Tested with trl==0.23.1, peft==0.17.1, math_verify==0.8.0, vllm==0.11.0, trackio==0.5.2 transformers==4.57.0；基础 GRPO 篇：# Tested with transformers==4.47.1, trl==0.14.0, datasets==3.2.0, peft==0.14.0, accelerate==1.2.1, math_verify==0.3.3'
consequence = "这些是可补入锁文件的线索，但在补齐前不能声称环境已锁定"

[[findings]]
id = "F09"
severity = "blocker"
summary = "xLAM 篇连安装命令都是注释，且在运行时动态装包"
evidence = '安装单元格为 # !uv pip install --upgrade bitsandbytes peft trl python-dotenv（整行被注释）；setup_hardware_config() 内还有 os.system("pip install flash_attn --no-build-isolation")'
consequence = "环境完全不可声明，更不可能锁定；页面虽给出 PyTorch 2.8.0+cu128 / H100 NVL 的运行快照，但那只是输出文本"

[[findings]]
id = "F10"
severity = "major"
summary = "code LLM 篇是唯一有真训练种子的一篇，但仍不完整"
evidence = 'SEED = 0；from transformers import set_seed；set_seed(SEED)；train_data.shuffle(buffer_size=5000, seed=SEED)；ConstantLengthDataset(..., seed=SEED)；并保留前 4000 条为 validation'
consequence = "这是 14 篇里最接近可复现的一篇；但 TrainingArguments 未显式传 seed，也没有 deterministic / cudnn / tf32 策略说明，按契约只能算 declared"

[[findings]]
id = "F11"
severity = "major"
summary = "RapidFire 是唯一有 compute_metrics 的一篇，但评估集与训练集完全重叠"
evidence = 'train_dataset = dataset["train"].select(range(64))；eval_dataset = dataset["train"].select(range(50, 60))；shuffle(seed=42) 只改顺序不改成员；sample_compute_metrics 用 evaluate.load("rouge") 算 rougeL'
consequence = "50–59 全部落在 0–63 内，ROUGE-L 数值是训练集内的记忆分数，不是泛化指标；页面也从未给出任何实际 loss / ROUGE-L 数值"

[[findings]]
id = "F12"
severity = "major"
summary = "grounding 篇训练与推理 prompt 模板确实不一致（一手确认）"
evidence = "训练 collator：prompts.append(f\"<image>Detect {sample['caption']}.\") 且额外传 suffix=label_for_paligemma；推理：prompt = f\"<image>detect {caption}\" 无句号、无 suffix"
consequence = "大小写、标点、标签注入三处不同；同时该篇确实有 train_test_split(test_size=0.2, seed=42, shuffle=False) 的 held-out 划分（此前记为「无 held-out」有误），但仍无定量指标"

[[findings]]
id = "F13"
severity = "note"
summary = "MPO 篇是唯一在安装命令中写出精确 pin 的一篇"
evidence = "!pip install -U -q git+https://github.com/huggingface/trl.git bitsandbytes qwen-vl-utils==0.0.8；原文自承：需从源码安装 trl，因为 MPO trainer 当时尚未进入 official release"
consequence = "qwen-vl-utils 可锁定，但 trl 仍指向 main 分支且无 commit；DPOConfig 里 bf16=False（与其它 VLM 篇相反）"

[[findings]]
id = "F14"
severity = "major"
summary = "VLM DPO 篇 DPOConfig 缺少关键算法参数"
evidence = 'DPOConfig 全文只给了 batch/epochs/eval/save 等工程项；beta、loss_type、learning_rate、max_length、max_prompt_length 均为「未提及」'
consequence = "DPO 的核心超参（beta / loss_type）依赖 TRL 0.12.2 默认值；一旦升级 trl 结果就会变，且无法从 recipe 文本还原"

[[findings]]
id = "F15"
severity = "blocker"
summary = "14 篇全部缺 source_sha，无法定位上游 notebook 漂移"
evidence = "本仓库 14 篇 source_sha 全为空；上游页面「Update on GitHub」链接也不带 commit hash"
consequence = "上游 recipe 修改后，我们无法判断本地记录对应的是哪一版，也无法做 diff"


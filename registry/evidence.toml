[xlam_adapter_audit]
assessed_at = "2026-11-13"
sources = ["https://huggingface.co/learn/cookbook/function_calling_fine_tuning_llms_on_xlam", "https://huggingface.co/datasets/Salesforce/xlam-function-calling-60k"]
primary_facts = "数据卡列 query(str)/tools(JSON字符串数组)/answers(JSON字符串数组)；tools 元素 name,description,parameters{param:{type,description,required}}，answers 元素 name,arguments；60000 条，gated 须接受条款并登录，声明 research purposes only；2024-07 曾重生成 1896 条。Cookbook 用 load_dataset(..., split='train')，process_xlam_sample 把 query/tools/answers 拼成 <user>/<tools>/<calls> 整段 text，SFTConfig(dataset_text_field='text', max_length=2048, optim='adamw_8bit', remove_unused_columns=False)，SFTTrainer 对整段文本做损失，无 completion-only loss/response_template；推理 prompt 截断为 '<user>...</user>\\n\\n<tools>'（不含工具定义），generate_function_call 用 do_sample=True/temperature=0.7/max_new_tokens=512；展示输出形如 {'name': 'x', 'arguments': {...}} 的 Python str(dict) 单引号字面量，不是合法 JSON。上游无 seed/revision/eval_dataset/compute_metrics，只有 3 条定性样例；安装单元格整行注释，setup_hardware_config 运行时 os.system 动态装 flash_attn，from_pretrained 带 trust_remote_code=True。"
local_deviations = "本仓 xlam-fc-v1 自建：transformers.Trainer + completion-only collator（仅 <calls> 严格JSON数组 </calls> + EOS 计 loss，prompt label=-100），给全 tools 定义，严格 JSON 输出且只用 json.loads 解析、绝不 eval 或执行生成调用；规范化内容 hash 80/10/10 + 全局去重、shared held-out、greedy、四个结构化指标、content fingerprint 绑定 xlam/upstream 协议段；eager attention、no remote code、no Hub push。LoRA target_modules 取上游原文 7 个；[quantization] nf4/bf16/double_quant 为本仓声明，页面未展示 bnb_config，不声称与上游一致。"
limits = "上游无定量 held-out 指标，自建 json_parse/schema 合法率是格式与协议指标，不等于真实 API 执行正确率、pass@1 或业务安全；数据卡 gated 且 research-only，商业使用与再分发未确认；2024-07 重生成条目使未冻结 revision 的输入可漂移；基座 8B 需授权，GPU/真实数据/API 兼容/显存全未实测；comparison/export 与发布级逐题重算、adapter-only 导出、HF offline 新进程复载已实装并有隔离离线测试，但只有合成证据、无真实 CUDA 三 seed 与真实 GPU 复载，导出容差未在真实 recipe 预声明（--full 失败关闭）；B1 不晋级。"


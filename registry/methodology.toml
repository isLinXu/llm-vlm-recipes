# ---------------------------------------------------------------------------
# 方法论主张：每条绑定一手论文、支撑类型与边界。support 语义：
#   paper_supports = 论文一手结论直接支持该做法；
#   we_adapted     = 我们据论文修正上游实现，属本仓工程判断，论文不直接保证；
#   paper_limited  = 论文结论有明确边界或本仓不适用，显式标注以防夸大。
# ---------------------------------------------------------------------------
[principles.grpo_critic_free]
paper = "deepseekmath_grpo"
support = "paper_supports"
scope = "design_guidance"
claim = "GRPO 是 PPO 的变体，用组内相对分数替代 critic 以降低内存，适合可核验 reward 的数学/RL 任务。"
boundary = "论文的 memory 结论限于其训练规模；本仓仍未 CUDA 实跑，不宣称内存收益已复现。"

[principles.reward_hacking_needs_independent_metric]
paper = "reward_overopt"
support = "paper_supports"
scope = "evaluation_guidance"
claim = "代理 reward 过度优化会偏离真实目标，因此 RL 训练须监控 reward 曲线与独立指标是否背离，背离即停止。"
boundary = "论文不提供本仓的 reward 阈值或背离判据数值；本仓的停止规则是设计约定。"

[principles.multiseed_underspecification]
paper = "underspecification"
support = "paper_supports"
scope = "evaluation_guidance"
claim = "同等 held-out 表现的多个模型可能在部署时行为不同，故对照需多个互异训练 seed 与区间，而非单 seed 点估计。"
boundary = "论文不规定 seed 数量；本仓至少 3 seed 与 Student-t95 是自建选择。"

[principles.self_consistency_not_for_repro]
paper = "self_consistency"
support = "paper_limited"
scope = "evaluation_guidance"
claim = "self-consistency 以多次采样换精度，与本仓单次 greedy 的可复现目标冲突，故评估固定 greedy，不引用其采样收益。"
boundary = "论文 GSM8K +17.9% 等数字来自其采样设置，不是本仓 expected。"

[principles.fim_augmentation_preserves_l2r]
paper = "fim_infill"
support = "paper_supports"
scope = "design_guidance"
claim = "把中间片段移到末尾的数据变换可教会自回归模型填充且不损害从左到右能力，支持 FIM 作为仓库级数据增强。"
boundary = "论文未证明 PSM/SPM 在具体语料的最优选择，也不执行生成代码或测编译率。"

[principles.peft_lora_reduces_memory]
paper = "lora"
support = "paper_supports"
scope = "design_guidance"
claim = "冻结预训练权重并注入低秩矩阵可大幅降低可训练参数与内存、无额外推理延迟，是 adapter-only 导出的依据。"
boundary = "论文的 10,000×/3× 是 GPT-3 175B 对比，不映射到本仓模型规模。"

[principles.qlora_fourbit]
paper = "qlora"
support = "paper_supports"
scope = "design_guidance"
claim = "4-bit NF4 + 双重量化 + paged optimizers 可在单卡微调大模型，是 QLoRA/nf4 装配的文献依据。"
boundary = "论文也指出聊天基准评估不可信，支持本仓定量 held-out；但论文结论不等于本仓已通过可信评估。"

[principles.dora_decomposition]
paper = "dora"
support = "paper_supports"
scope = "design_guidance"
claim = "DoRA 把权重分解为幅度与方向、方向用 LoRA 更新，在学习能力与稳定性上优于 LoRA 且无额外推理开销。"
boundary = "限于论文实验的 LLaMA/LLaVA/VL-BART；本仓 use_dora 配置正确性与指标均未验收。"

[principles.completion_only_loss]
paper = "lora"
support = "we_adapted"
scope = "design_guidance"
claim = "本仓改用 completion-only collator，只对回答/loc/bbox 后缀与 EOS 计 loss、prompt 与图像 token 置 -100，以修正 Cookbook 的全文损失。"
boundary = "这是本仓基于 PEFT 的工程判断，LoRA 论文不直接证明 mask 正确性；其上训练与指标未实测。"

[principles.image_level_split]
paper = "dedup_training_data"
support = "we_adapted"
scope = "design_guidance"
claim = "本仓按图像原始字节 hash 做 80/10/10 分段并对规范化问答全局去重，防止同图变体跨 split 泄漏。"
boundary = "去重论文的粒度是文本子串/文档；图像字节 hash 隔离是本仓自建，未验收。"

[principles.dedup_reduces_leakage]
paper = "dedup_training_data"
support = "paper_supports"
scope = "design_guidance"
claim = "训练语料近重复会造成记忆与 train-test 重叠，去重可降低记忆频率与重叠、提升评估准确性。"
boundary = "论文不覆盖 repo/问题/图像实体级隔离粒度，本仓的隔离充分性未验收。"

[principles.datasheets_license_documentation]
paper = "datasheets"
support = "paper_supports"
scope = "upstream_finding"
claim = "数据集应文档化来源、组成、收集过程、推荐用途与许可，故本仓逐篇登记 license pending 而不擅自假定可商用。"
boundary = "论文是文档框架，不判定具体许可；Bitext/xLAM/Geoperception/RefCOCO 许可仍待确认。"

[principles.dpo_closed_form]
paper = "dpo"
support = "paper_supports"
scope = "design_guidance"
claim = "DPO 以闭式最优策略把偏好对齐化为分类损失，免去显式 reward model 与采样，是偏好篇的主方法依据。"
boundary = "论文的偏好是人类标注文本，不覆盖图像偏好；DPO 稳定性不自动迁移到 VLM。"

[principles.rlaif_v_open_feedback]
paper = "rlaif_v"
support = "paper_supports"
scope = "upstream_finding"
claim = "RLAIF-V 用开源 MLLM 反馈替代人工标注降低幻觉，支持图像偏好篇以 AI 反馈构建 chosen/rejected 的方向。"
boundary = "论文 80.7%/33.7% 是其 7B 结果，不是本仓目标；本仓该篇五维尚未实现。"

[principles.shared_backbone_ablation]
paper = "underspecification"
support = "we_adapted"
scope = "evaluation_guidance"
claim = "DPO 与 MPO 必须用同 backbone / 同偏好 split 做配对对照，否则算法差异与模型差异混淆，无法归因。"
boundary = "现有 Cookbook 两篇模型不同，不满足该前提；本仓两篇五维未实现，无法做配对实验。"

[principles.toolformer_api_args]
paper = "toolformer"
support = "paper_supports"
scope = "design_guidance"
claim = "工具调用需学会选择 API、决定参数并融入后续预测，支持 function-calling 任务对 tools 与参数结构做严格 schema 校验。"
boundary = "论文不证明严格 JSON 数组输出或 gold 不进 prompt 的必要性，那些是本仓自建协议。"

[principles.strict_json_completion_only]
paper = "toolformer"
support = "we_adapted"
scope = "design_guidance"
claim = "本仓仅对 <calls> 严格 JSON 数组 + EOS 计 loss、给全 tools、gold 不进输入，并用 json.loads 解析且绝不执行生成调用。"
boundary = "四指标是格式/协议指标，不等于 pass@1 或真实 API 执行正确率；无 GPU 实跑。"

[principles.vllm_off_on_ablation]
paper = "vllm_pagedattention"
support = "paper_supports"
scope = "design_guidance"
claim = "vLLM 的吞吐收益来自 serving 层 KV cache 管理，故 colocate 篇须做只改开关的同配置 on/off 对照才能归因。"
boundary = "论文 2–4× 不是本仓 rollout 结果；本仓 vLLM 篇五维未实现。"

[principles.single_box_iou_loc]
paper = "qwen25vl"
support = "we_adapted"
scope = "design_guidance"
claim = "本仓对 grounding 用 COCO xywh→xyxy、1024 桶 <loc####> round-trip IoU 与单框四指标，修正 Cookbook 的格式与 prompt 不一致。"
boundary = "Qwen2.5-VL 论文描述的是其原生定位能力，不支撑本仓 loc 协议；单框 IoU 不等于 mAP/AP。"

[principles.chartqa_zero_train_gate]
paper = "chartqa"
support = "we_adapted"
scope = "upstream_finding"
claim = "Qwen2-VL ChartQA 篇因上游自承零训练基线达标而 decision.gate=blocked，训练无业务增量，方法论上应拒绝投入训练预算。"
boundary = "这是 Cookbook 一手 decision 门结论，ChartQA 论文只定义数据集；补代码或 GPU 证据都不解除该阻塞。"

[principles.chartqa_contamination]
paper = "dedup_training_data"
support = "we_adapted"
scope = "upstream_finding"
claim = "SmolVLM-Instruct 基座已在 ChartQA 上训练过，同集 held-out 不构成泛化验证，须换未污染外部集才能作 baseline。"
boundary = "污染事实来自 Cookbook 与基座说明，去重论文只提供方法论动机；换集与重判均未完成。"

[principles.qualitative_only_gap]
paper = "qlora"
support = "paper_supports"
scope = "evaluation_guidance"
claim = "Cookbook 只展示单样本定性生成，须补定量 held-out；QLoRA 论文也指出聊天基准不足以免信，支持这一评估纪律。"
boundary = "论文结论不代替本仓指标；本仓定量协议已声明但未在 CUDA 上实测。"

[principles.lima_quality_over_quantity]
paper = "lima"
support = "paper_supports"
scope = "design_guidance"
claim = "少量高质量指令即可对齐且知识主要来自预训练，支持客服 SFT 以规范化问答质量与去重为先，而非堆样本数。"
boundary = "论文针对 65B 通用对齐；本仓 RapidFire 的 4 配置与 ROUGE-L 口径不从该论文推出。"

[principles.session_isolation]
paper = "reward_overopt"
support = "we_adapted"
scope = "design_guidance"
claim = "在线 agent RL 须按对局/词表隔离并回收会话，避免 reward 与独立指标背离时泄漏状态或误判收益。"
boundary = "论文讲 reward 过优化规律，不覆盖环境生命周期；本仓 Wordle 篇五维未实现。"


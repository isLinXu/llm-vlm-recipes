# 方法论依据层：回答第四個问题——「这么设计，依据哪篇 practice 论文的一手结论」。
#
# 与另外三层审计互不替代，也都不解锁 GPU 晋级：
#   - capabilities.toml：代码 + offline test 是否实装（能不能跑起来）；
#   - baseline.toml / baseline_evidence.py：证据与就绪度（有没有真实跑过）；
#   - feasibility.toml：实验目标是否成立（值不值得当 baseline）；
#   - 本文件：设计决策的文献依据（为什么这么设计、边界在哪、论文没证明什么）。
#
# 铁律（由 src/recipe_lab/methodology.py 强制）：
#   1. 每条 paper 必须有一手摘要页核查；verified=true 需 arxiv_id/title/year/core_claim/boundary 齐全。
#   2. verified=false 的论文只能进 supplement_papers，不能作为 principle 的 paper 直接支持主张。
#   3. 论文的 benchmark 数字不得写成本仓 evaluation.expected/tolerance；本仓只声明设计依据。
#   4. 14 篇精确覆盖；每篇必须有立场说明和至少一条方法论主张。
#   5. 一手核查中发现的编号误用必须登记到 [[corrections]]，was != now。
#   6. 原理性阻塞篇（blocked_zero_train / contaminated_pretraining）必须显式引用对应的
#      chartqa 方法论主张来论证「为什么不Train」，不得靠论文背书冒充可晋级。

schema = 1
assessed_at = "2026-11-17"
expected_recipe_count = 14
title = "方法论依据登记（practice papers）"

[integrity]
# 禁止出现在任何 claim / boundary / stance 中的宣称模式：论文依据不等于本仓实测。
forbidden_claim_phrases = [
  "已在本仓 GPU 验证", "已在 CUDA 实跑", "GPU verified", "达到 B2", "达到 B3",
  "eligible", "本仓 expected =", "本仓 tolerance =", "复现了论文分数",
]
supports = ["paper_supports", "we_adapted", "paper_limited"]
scopes = ["design_guidance", "upstream_finding", "evaluation_guidance"]

# ---------------------------------------------------------------------------
# 一手核查过的论文库。core_claim 只写摘要页明确陈述的结论；boundary 写论文
# 没有证明、或本仓不适用的部分（缺一项即视为未核查，verified 必须 false）。
# ---------------------------------------------------------------------------
